      - region [ref=e107]:
        - generic [ref=e108]:
          - generic [ref=e110]: "1"
          - heading "¿Cómo visten en las reuniones y al predicar?" [level=2] [ref=e111]
        - paragraph [ref=e112]: Lo más habitual sigue siendo vestir de manera formal para las reuniones y la predicación. La ropa no es idéntica en todas partes y cada persona elige prendas distintas, pero la imagen reconocible suele ser la de hombres con traje y corbata y mujeres con falda o vestido. En 2023 y 2024 se anunciaron cambios concretos sobre la barba, los pantalones de vestir y el uso de chaqueta y corbata.
        - table [ref=e114]:
          - rowgroup [ref=e115]:
            - row [ref=e116]:
              - columnheader "Situación" [ref=e117]
              - columnheader "Qué suele verse o qué cambió" [ref=e118]
              - columnheader "Matices" [ref=e119]
          - rowgroup [ref=e120]:
            - row [ref=e121]:
              - rowheader "Reuniones" [ref=e122]
              - 'cell "Es habitual ver ropa formal: traje y corbata en muchos hombres, y falda o vestido en muchas mujeres." [ref=e123]'
              - cell "Las prendas y costumbres varían según el país, el clima y la actividad." [ref=e124]
            - row [ref=e125]:
              - rowheader "Barba" [ref=e126]
              - cell "Desde diciembre de 2023, llevarla es una decisión personal y no debería afectar a los nombramientos." [ref=e127]
              - cell "La aclaración respondió a preguntas sobre hermanos con responsabilidades; el artículo de 2025 muestra que a algunas personas aún les sorprendía ver barbas en discursos." [ref=e128]
            - row [ref=e129]:
              - rowheader "Pantalones de mujer" [ref=e130]
              - cell "El anuncio de marzo de 2024 los permite en el ministerio y al asistir a reuniones y asambleas." [ref=e131]
              - cell "Para intervenir en el programa, el anuncio conserva la referencia a falda o vestido cuando esa sea la costumbre local." [ref=e132]
            - row [ref=e133]:
              - rowheader "Chaqueta y corbata de hombre" [ref=e134]
              - cell "Desde marzo de 2024, pueden decidir si las llevan en el ministerio y al asistir a reuniones y asambleas." [ref=e135]
              - cell "Para intervenir en el programa, el anuncio mantiene chaqueta y corbata cuando esa sea la costumbre local." [ref=e136]
            - row [ref=e137]:
              - rowheader "Visita a Betel" [ref=e138]
              - cell "El anuncio de 2024 recomienda chaqueta y corbata para hombres y falda o vestido para mujeres cuando sea la costumbre local." [ref=e139]
              - cell "Es una orientación condicionada, no una descripción de la ropa cotidiana de los Testigos." [ref=e140]
      - region [ref=e141]:
        - generic [ref=e142]:
          - generic [ref=e144]: "2"
          - heading "¿Por qué suelen vestir de forma formal?" [level=2] [ref=e145]
        - paragraph [ref=e146]: La organización explica que procura vestir con respeto y modestia cuando se reúne o predica. Para muchos Testigos, ir arreglados también forma parte de representar a su congregación y de mostrar que consideran importantes esas actividades.
        - paragraph [ref=e147]: Eso no significa que haya un uniforme mundial ni que todas las personas vistan igual. La ropa concreta depende de la cultura y de la situación. En actos religiosos, sin embargo, la presentación formal ha sido una expectativa reconocible durante mucho tiempo y sigue siendo común.
        - paragraph [ref=e148]: La ropa formal sigue siendo la imagen más reconocible en reuniones y predicación, aunque las prendas y su grado de formalidad cambien según el lugar.
      - region [ref=e149]:
        - generic [ref=e150]:
          - generic [ref=e151]:
            - generic [ref=e152]:
              - generic [ref=e154]: "3"
              - heading "¿Pueden llevar barba? Qué cambió en 2023" [level=2] [ref=e155]
            - paragraph [ref=e156]:
              - strong [ref=e157]: Sí.
              - text: En el Informe 8 del Cuerpo Gobernante, del 15 de diciembre de 2023
              - superscript [ref=e158]:
                - link "Fuente 1" [ref=e159] [cursor=pointer]:
                  - /url: "#fn-1"
                  - text: "1"
              - text: ", la organización explicó que la Biblia no condena la barba y pidió que no se juzgara a un hombre por decidir llevarla. El anuncio también está disponible en su transcripción en español"
              - superscript [ref=e160]:
                - link "Fuente 2" [ref=e161] [cursor=pointer]:
                  - /url: "#fn-2"
                  - text: "2"
              - text: .
            - paragraph [ref=e162]: El informe afirma que la Biblia no condena la barba y que, por tanto, llevarla es una decisión personal. También aborda expresamente si un hermano con barba puede ocupar responsabilidades y dice que sus aptitudes deben juzgarse por su espiritualidad, no por el vello facial. Esto permite concluir que la apariencia había tenido peso organizativo en ese ámbito; no demuestra que existiera una prohibición escrita idéntica o aplicada con la misma intensidad en todas las congregaciones.
            - paragraph [ref=e163]: Por eso, «¿por qué los Testigos de Jehová no usan barba?» parte hoy de una premisa desactualizada. La respuesta más completa es que durante años la expectativa de ir afeitado pudo influir en la aceptación social y en el acceso a ciertas responsabilidades, aunque la Biblia no prohíba la barba; desde 2023, la organización afirma que es una decisión personal. Una persona puede llevarla y otra preferir afeitarse.
          - figure [ref=e164]:
            - img "Ilustración de una maquinilla, un peine y un cepillo de barba conectados por un hilo lima suelto." [ref=e165]
      - region [ref=e166]:
        - generic [ref=e167]:
          - generic [ref=e169]: "4"
          - heading "Qué aporta el artículo de 2025" [level=2] [ref=e170]
        - paragraph [ref=e171]:
          - text: En julio de 2025,
          - emphasis [ref=e172]: La Atalaya
          - text: publicó el relato de una Testigo de Eslovenia
          - superscript [ref=e173]:
            - link "Fuente 3" [ref=e174] [cursor=pointer]:
              - /url: "#fn-3"
              - text: "3"
          - text: "que dijo haberse sorprendido al ver por primera vez a un hermano barbudo dar un discurso, pese a conocer el anuncio de 2023. Contó que oró para adaptarse al cambio. Es un testimonio individual publicado por la propia organización: no mide cuántos miembros reaccionaron así, pero muestra que la antigua expectativa seguía teniendo fuerza para algunas personas. El artículo de 2025 no anuncia una nueva norma sobre barba o ropa; promueve aceptar los cambios de dirección de la organización."
        - paragraph [ref=e175]: "Queda una pregunta: si la barba no estaba prohibida por la Biblia, ¿por qué la expectativa anterior llegó a influir en quién parecía apropiado para representar a la congregación? En 2023, el informe explicó: las costumbres sociales cambian y la organización no quiere juzgar ni fomentar divisiones por ese asunto. Eso explica cómo justificó el cambio; no demuestra por sí solo todos los motivos por los que mantuvo antes la expectativa. Afirmar que buscaba retener miembros o mejorar su imagen sería una hipótesis, no un hecho probado por las fuentes consultadas."
      - region [ref=e176]:
        - generic [ref=e177]:
          - generic [ref=e178]:
            - generic [ref=e179]:
              - generic [ref=e181]: "5"
              - heading "¿Las mujeres tienen que llevar falda?" [level=2] [ref=e182]
            - paragraph [ref=e183]:
              - strong [ref=e184]: No para asistir a todas las actividades.
              - text: El Informe 2 del Cuerpo Gobernante, del 15 de marzo de 2024
              - superscript [ref=e185]:
                - link "Fuente 4" [ref=e186] [cursor=pointer]:
                  - /url: "#fn-4"
                  - text: "4"
              - text: anunció que las mujeres pueden llevar
              - strong [ref=e187]: pantalones de vestir
              - text: al participar en el ministerio y al asistir a reuniones y asambleas de circuito o regionales. Pidió que fueran prendas dignas, modestas y apropiadas, no informales.
            - paragraph [ref=e188]:
              - text: El mismo anuncio distingue entre asistir y participar en el programa. Si una mujer interviene en él, debe llevar falda o vestido
              - strong [ref=e189]: cuando esa sea la costumbre del lugar donde vive
              - text: . También puede elegir falda o vestido aunque no intervenga. La transcripción oficial
              - superscript [ref=e190]:
                - link "Fuente 5" [ref=e191] [cursor=pointer]:
                  - /url: "#fn-5"
                  - text: "5"
              - text: permite leer exactamente a qué situaciones se refiere.
            - paragraph [ref=e192]: Así, ni «siempre tienen que llevar falda» ni «ahora cualquier prenda vale para cualquier función» resume bien la orientación de 2024. El comunicado tampoco establece una longitud universal para las faldas.
          - figure [ref=e193]:
            - img "Ilustración de unos pantalones de vestir y una falda colgados en perchas, unidos por un hilo lima." [ref=e194]
      - region [ref=e195]:
        - generic [ref=e196]:
          - generic [ref=e197]:
            - generic [ref=e198]:
              - generic [ref=e200]: "6"
              - heading "¿Los hombres necesitan traje y corbata?" [level=2] [ref=e201]
            - paragraph [ref=e202]:
              - strong [ref=e203]: No siempre.
              - text: Desde el anuncio de marzo de 2024, los hombres pueden decidir si llevan chaqueta o corbata en el ministerio y al asistir a reuniones y asambleas. Si no las llevan, la organización sigue pidiendo una apariencia apropiada, modesta y digna, no informal.
            - paragraph [ref=e204]:
              - text: Si participan en el programa, deben llevar chaqueta
              - strong [ref=e205]: "y"
              - text: corbata cuando esa sea la costumbre local. Pueden elegir esas prendas aunque no participen. El informe no dice que el traje sea obligatorio para todo asistente ni que haya dejado de importar cómo se viste quien representa a la congregación.
          - figure [ref=e206]:
            - img "Ilustración de una chaqueta y una corbata sobre una silla, junto a un hilo lima suelto." [ref=e207]
      - region [ref=e208]:
        - generic [ref=e209]:
          - generic [ref=e210]:
            - generic [ref=e211]:
              - generic [ref=e213]: "7"
              - heading "¿Qué cambia al participar en el programa o visitar Betel?" [level=2] [ref=e214]
            - paragraph [ref=e215]:
              - text: El anuncio de 2024 traza una diferencia concreta entre
              - strong [ref=e216]: asistir
              - text: "y"
              - strong [ref=e217]: tomar parte en el programa
              - text: de reuniones y asambleas. Para esta última función, menciona falda o vestido en mujeres y chaqueta y corbata en hombres cuando sea la costumbre del lugar.
            - paragraph [ref=e218]: "También añade una orientación para las visitas a Betel: en los lugares donde sea la costumbre, considera apropiado que los hombres lleven chaqueta y corbata, y las mujeres falda o vestido. Estas condiciones aparecen en el anuncio completo y no deben perderse al resumir los cambios de 2024."
          - figure [ref=e219]:
            - img "Ilustración de una persona sentada entre varias sillas y otra ante un atril, conectadas por un hilo lima." [ref=e220]
      - region [ref=e221]:
        - generic [ref=e222]:
          - generic [ref=e223]:
            - generic [ref=e224]:
              - generic [ref=e226]: "8"
              - heading "¿Y en la vida diaria o en otros países?" [level=2] [ref=e227]
            - paragraph [ref=e228]:
              - text: Los anuncios oficiales hablan de reuniones, asambleas, ministerio y visitas a Betel.
              - strong [ref=e229]: No fijan un código universal para el trabajo, la casa o el tiempo libre.
              - text: Las investigaciones y observaciones describen situaciones concretas, no cómo viste cada Testigo en todos los ámbitos.
            - paragraph [ref=e230]: La organización menciona la costumbre local para determinadas funciones. Eso confirma que el contexto importa. Los testimonios de miembros y exmiembros pueden ayudar a entender la experiencia —por ejemplo, sentirse observado, recibir comentarios o tener que cambiarse para una actividad—, pero cada relato debe atribuirse a quien lo vivió. No contamos aquí con datos representativos para comparar países o medir la práctica actual.
          - figure [ref=e231]:
            - img "Ilustración de una persona en una sala de reunión y otra en un espacio cotidiano, unidas por un hilo lima." [ref=e232]
