              - generic [ref=e207]:
                - paragraph [ref=e208]:
                  - strong [ref=e209]: "Asunto:"
                  - text: Renuncia expresa a los Testigos de Jehová y ejercicio de los derechos de supresión y oposición
                - paragraph [ref=e210]: "Al Delegado de Protección de Datos:"
                - paragraph [ref=e211]: Por medio del presente escrito, manifiesto de forma expresa, libre e inequívoca mi decisión de dejar de pertenecer a los Testigos de Jehová y de no mantener ningún vínculo religioso con dicha organización.
                - paragraph [ref=e212]: Asimismo, ejerzo mi derecho de supresión de mis datos personales, conforme al artículo 17 del Reglamento (UE) 2016/679 (RGPD), y mi derecho de oposición al tratamiento de mis datos, conforme a su artículo 21.
                - paragraph [ref=e213]: "Por tanto, solicito:"
                - paragraph [ref=e214]: 1. Que se supriman todos mis datos personales que obren en poder de la organización, sus congregaciones, responsables, colaboradores o sistemas de información, salvo aquellos cuya conservación sea legalmente obligatoria. 2. Que se deje de utilizar mi nombre, datos de contacto, domicilio, teléfono, correo electrónico, fotografías, información sobre mi situación personal o cualquier otra información que permita identificarme, para fines religiosos, administrativos, de contacto, visitas, llamadas, comunicaciones o cualquier otra actividad. 3. Que no se me contacte por ningún medio, directamente o a través de terceras personas, con fines religiosos ni para tratar de modificar o cuestionar mi decisión. 4. Que, cuando proceda, se comunique esta solicitud de supresión a los terceros a quienes se hayan comunicado mis datos, conforme al artículo 19 del RGPD. 5. Que se me confirme por escrito la recepción de esta solicitud y las actuaciones realizadas.
                - paragraph [ref=e215]: Si determinados datos no pudieran suprimirse por existir una obligación legal de conservación, solicito que se me indique qué datos se conservan, durante cuánto tiempo y con qué base jurídica, y que queden bloqueados y no se utilicen para ninguna otra finalidad.
                - paragraph [ref=e216]: Esta decisión no requiere explicación ni justificación. Solicito que esta petición se tramite en el plazo previsto en el RGPD y en la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales.
                - paragraph [ref=e217]: A efectos de identificación, adjunto copia de mi documento de identidad.
                - paragraph [ref=e218]: En [lugar], a [fecha].
                - paragraph [ref=e219]: "[Firma] Nombre y apellidos: [ ] DNI/NIE/Pasaporte: [ ] Correo electrónico a efectos de notificaciones: [ ]"
              - generic [aria-hidden] [ref=e220]: "Asunto: Renuncia expresa a los Testigos de Jehová y ejercicio de los derechos de supresión y oposición Al Delegado de Protección de Datos: Por medio del presente escrito, manifiesto de forma expresa, libre e inequívoca mi decisión de dejar de pertenecer a los Testigos de Jehová y de no mantener ningún vínculo religioso con dicha organización. Asimismo, ejerzo mi derecho de supresión de mis datos personales, conforme al artículo 17 del Reglamento (UE) 2016/679 (RGPD), y mi derecho de oposición al tratamiento de mis datos, conforme a su artículo 21. Por tanto, solicito: 1. Que se supriman todos mis datos personales que obren en poder de la organización, sus congregaciones, responsables, colaboradores o sistemas de información, salvo aquellos cuya conservación sea legalmente obligatoria. 2. Que se deje de utilizar mi nombre, datos de contacto, domicilio, teléfono, correo electrónico, fotografías, información sobre mi situación personal o cualquier otra información que permita identificarme, para fines religiosos, administrativos, de contacto, visitas, llamadas, comunicaciones o cualquier otra actividad. 3. Que no se me contacte por ningún medio, directamente o a través de terceras personas, con fines religiosos ni para tratar de modificar o cuestionar mi decisión. 4. Que, cuando proceda, se comunique esta solicitud de supresión a los terceros a quienes se hayan comunicado mis datos, conforme al artículo 19 del RGPD. 5. Que se me confirme por escrito la recepción de esta solicitud y las actuaciones realizadas. Si determinados datos no pudieran suprimirse por existir una obligación legal de conservación, solicito que se me indique qué datos se conservan, durante cuánto tiempo y con qué base jurídica, y que queden bloqueados y no se utilicen para ninguna otra finalidad. Esta decisión no requiere explicación ni justificación. Solicito que esta petición se tramite en el plazo previsto en el RGPD y en la Ley Orgánica 3/2018,