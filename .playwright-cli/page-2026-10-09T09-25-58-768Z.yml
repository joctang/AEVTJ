        - generic [ref=e62]:
          - heading "La postura de la AEVTJ" [level=2] [ref=e63]
          - paragraph [ref=e64]: Desde la AEVTJ no recomendamos enviarla. Aun así, sabemos que a algunas personas les sirve, sobre todo si quieren dejar de constar como miembros o que se borren sus datos. Por eso, al final de esta página tienes dos modelos.
      - generic [ref=e66]:
        - generic [ref=e67]:
          - generic [ref=e68]:
            - generic [aria-hidden] [ref=e69]: "1"
            - heading "Nadie tiene que darte permiso" [level=2] [ref=e70]
          - paragraph [ref=e71]: La Ley Orgánica de Libertad Religiosa reconoce el derecho de toda persona a «cambiar de confesión o abandonar la que tenía», sin coacción (artículo 2.1.a). La Constitución añade que nadie puede ser obligado a declarar sobre sus creencias (artículo 16).
          - paragraph [ref=e72]: La organización dice lo mismo a su manera. Según jw.org, se puede renunciar de palabra, por escrito o con una conducta que muestre que ya no se quiere pertenecer, y los ancianos no pueden obligar a nadie a seguir siendo Testigo.
        - generic [ref=e73]:
