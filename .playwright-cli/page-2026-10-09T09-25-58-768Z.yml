            - heading "Qué ocurre si envías la carta" [level=2] [ref=e94]
          - paragraph [ref=e95]: "Las publicaciones de la organización describen lo que sucede tras una renuncia formal:"
          - list [ref=e96]:
            - listitem [ref=e97]:
              - strong [ref=e98]: Se anuncia en la congregación.
              - text: El libro
              - emphasis [ref=e99]: Organizados para hacer la voluntad de Jehová
              - text: "indica que se hace un breve anuncio: «[Nombre] ya no es testigo de Jehová». No se dice si la persona renunció o fue sacada."
            - listitem [ref=e100]:
              - strong [ref=e101]: Se te trata como a una persona expulsada.
              - text: El mismo libro equipara la desasociación con la expulsión. Según sus normas, los miembros dejan de relacionarse socialmente contigo.
            - listitem [ref=e102]:
              - strong [ref=e103]: La familia que vive contigo mantiene la convivencia,
              - text: según jw.org.
          - paragraph [ref=e104]: Cada familia y cada congregación lo viven de forma distinta. Hay quien mantiene el contacto con los suyos y hay quien lo pierde. Pero una vez anunciada, la renuncia tiene las mismas consecuencias sociales que una expulsión.
        - generic [ref=e105]:
          - img "Persona con capucha que se aleja por una calle estrecha." [ref=e108]
          - generic [ref=e109]:
            - generic [ref=e110]:
              - generic [aria-hidden] [ref=e111]: "4"
              - heading "Por qué la AEVTJ desaconseja la carta" [level=2] [ref=e112]
            - paragraph [ref=e113]: "Enviar una carta de renuncia es, en la práctica, pedir a la organización que registre tu salida y la anuncie. Es seguir dándole un papel en tu vida: aceptar que su sistema disciplinario interno decida cómo te ven y te tratan tus familiares y amistades."
            - paragraph [ref=e114]:
              - strong [ref=e115]: Tu libertad para irte no depende de ellos.
              - text: No necesitas su aprobación, ni una reunión con los ancianos, ni un anuncio en el Salón del Reino para dejar de creer o de participar.
            - paragraph [ref=e116]: Además, la carta suele adelantar el aislamiento social. Muchas personas prefieren alejarse poco a poco y conservar sus relaciones mientras puedan.
        - generic [ref=e117]:
          - generic [ref=e118]:
            - generic [ref=e119]:
              - generic [ref=e120]:
                - generic [aria-hidden] [ref=e121]: "5"
                - heading "Cuándo la carta sí puede ayudarte" [level=2] [ref=e122]
              - paragraph [ref=e123]: "Aun así, la decisión es tuya, y hay situaciones en las que puede tener sentido:"
              - list [ref=e124]:
                - listitem [ref=e125]:
                  - strong [ref=e126]: Quieres dejar de constar como miembro.
                  - text: Mientras no renuncies, la organización te sigue considerando Testigo, aunque lleves años sin ir.
                - listitem [ref=e127]:
                  - strong [ref=e128]: Quieres que borren tus datos.
                  - text: La organización ha llegado a denegar el borrado de datos alegando que la persona seguía siendo miembro. Tras la salida, el Tribunal Supremo limitó lo que puede conservar a tu nombre, la fecha de bautismo y la fecha de salida, y solo por si algún día pides volver.
                - listitem [ref=e129]:
                  - strong [ref=e130]: Quieres que dejen de visitarte o llamarte
                  - text: para que vuelvas.
                - listitem [ref=e131]:
                  - strong [ref=e132]: Te importa hacerlo de forma coherente
                  - text: con lo que piensas, o cerrar esa etapa con un acto concreto.
            - figure [ref=e133]:
              - img "Varias personas acercan las manos en un gesto de apoyo mutuo." [ref=e134]
          - paragraph [ref=e135]: "Sobre las cifras: los recuentos públicos de la organización solo incluyen a los «publicadores», las personas que predican e informan su actividad. Si ya no participas, no apareces en esas cifras, envíes o no la carta. La carta sí cambia cómo constas en sus registros internos."
        - generic [ref=e136]:
