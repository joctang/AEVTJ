      - region [ref=f16e125]:
        - generic [ref=f16e126]:
          - generic [ref=f16e128]: "1"
          - heading "¿Qué dicen hoy sobre la Navidad?" [level=2] [ref=f16e129]
        - paragraph [ref=f16e130]:
          - text: La organización da cuatro razones en su
          - link "web oficial" [ref=f16e131] [cursor=pointer]:
            - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-celebran-la-navidad/
          - text: ":"
        - generic [ref=f16e132]:
          - article [ref=f16e133]:
            - text: “
            - generic [aria-hidden] [ref=f16e134]: "01"
            - heading "Lo que pidió Jesús" [level=3] [ref=f16e135]
            - paragraph [ref=f16e136]: Jesús pidió a sus seguidores que recordaran su muerte. Sobre su nacimiento no dijo nada, ni en un sentido ni en otro, y la organización interpreta ese silencio como que no quería que se celebrara.
          - article [ref=f16e137]:
            - text: “
            - generic [aria-hidden] [ref=f16e138]: "02"
            - heading "El ejemplo de los primeros cristianos" [level=3] [ref=f16e139]
            - paragraph [ref=f16e140]: Dice que los apóstoles no celebraban la Navidad.
          - article [ref=f16e141]:
            - text: “
            - generic [aria-hidden] [ref=f16e142]: "03"
            - heading "La fecha" [level=3] [ref=f16e143]
            - paragraph [ref=f16e144]: La Biblia no dice en ningún sitio que Jesús naciera el 25 de diciembre.
          - article [ref=f16e145]:
            - text: “
            - generic [aria-hidden] [ref=f16e146]: "04"
            - heading "El origen de la fiesta" [level=3] [ref=f16e147]
            - paragraph [ref=f16e148]: Considera que sus raíces en otras religiones la hacen incompatible con su fe.
        - figure [ref=f16e149]:
          - text: “
          - generic [ref=f16e150]:
            - generic [ref=f16e151]: Texto original
            - blockquote [ref=f16e152]:
              - paragraph [ref=f16e153]: «Jesús mandó que se recordara su muerte, no su nacimiento. Ni los apóstoles de Jesús ni los primeros cristianos celebraban la Navidad.»
              - paragraph [ref=f16e154]: «Entendemos que Dios no aprueba la Navidad, pues tiene su origen en costumbres y ritos paganos.»
            - paragraph [ref=f16e155]:
              - text: —
              - link "«¿Por qué no celebran los testigos de Jehová la Navidad?»" [ref=f16e156] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-celebran-la-navidad/
              - text: ", jw.org"
        - paragraph [ref=f16e157]: "Eso no quiere decir que no crean en Jesús ni que rechacen los regalos o las reuniones familiares. Por eso, decirle a un Testigo que vaya a la cena de Nochebuena «aunque sea por estar juntos» no suele servir de mucho: para él, el problema es participar en una fiesta que considera que no agrada a Dios."
      - region [ref=f16e158]:
        - generic [ref=f16e159]:
          - generic [ref=f16e161]: "2"
          - heading "¿En qué textos de la Biblia se apoyan?" [level=2] [ref=f16e162]
        - paragraph [ref=f16e163]: La Biblia no menciona la Navidad en ningún sitio. Lo que hace la organización es aplicar algunos pasajes a una fiesta que apareció siglos después.
        - generic [ref=f16e164]:
          - heading "Recordar la muerte de Jesús" [level=3] [ref=f16e165]
          - paragraph [ref=f16e166]:
            - text: En
            - link "Lucas 22:19-20" [ref=f16e167] [cursor=pointer]:
              - /url: https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/lucas/22/
            - text: ", durante la última cena, Jesús comparte pan y vino con sus discípulos y les pide que lo hagan en memoria suya. Los Testigos se basan en ese pasaje para su Conmemoración anual. Para ellos es la única celebración que Jesús mandó, y de ahí deducen que recordar su nacimiento no forma parte de lo que él pidió."
        - generic [ref=f16e168]:
          - heading "Separarse de otros cultos" [level=3] [ref=f16e169]
          - paragraph [ref=f16e170]:
            - link "2 Corintios 6:14-18" [ref=f16e171] [cursor=pointer]:
              - /url: https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/2-corintios/6/
            - text: pide a los creyentes que se aparten de los ídolos y de lo impuro. La organización lo aplica a la Navidad por el origen que atribuye a sus costumbres. Su artículo
            - link "«¿Qué dice la Biblia acerca de la Navidad?»" [ref=f16e172] [cursor=pointer]:
              - /url: https://www.jw.org/es/ense%C3%B1anzas-b%C3%ADblicas/preguntas/qu%C3%A9-dice-la-biblia-acerca-de-la-navidad/
            - text: "añade el episodio del becerro de oro (Éxodo 32:5-7): aunque una fiesta se dedique a Dios, eso no la hace aceptable."
          - paragraph [ref=f16e173]: "Su razonamiento une dos ideas: que algunas costumbres navideñas vienen de cultos anteriores al cristianismo y que la Biblia pide apartarse de esos cultos. Sobre el origen de la fecha y de las costumbres también han escrito muchos historiadores; lo resumimos más abajo."
      - region [ref=f16e174]:
        - generic [ref=f16e175]:
          - generic [ref=f16e177]: "3"
          - heading "¿Cómo pasaron de celebrarla a rechazarla?" [level=2] [ref=f16e178]
        - paragraph [ref=f16e179]: La historia no empieza en la antigua Roma, sino en Brooklyn.
        - paragraph [ref=f16e180]:
          - text: Su libro
          - link [ref=f16e181] [cursor=pointer]:
            - /url: https://wol.jw.org/es/wol/pc/r4/lp-s/1200273077/1302/10
            - emphasis [ref=f16e182]: Los testigos de Jehová, proclamadores del Reino de Dios
          - text: "cuenta que en Betel, su sede central, se celebraba la Navidad todos los años. Ya sabían que el 25 de diciembre no era la fecha real del nacimiento, pero les parecía bien recordarlo y hacer el bien a los demás. Conocían el problema de la fecha, pero no lo veían como un motivo para dejar de celebrarla. El cambio no llegó de un día para otro: fue un proceso de casi cincuenta años."
        - figure [ref=f16e183]:
          - text: “
          - generic [ref=f16e184]:
            - generic [ref=f16e185]: Texto original
            - blockquote [ref=f16e186]:
              - paragraph [ref=f16e187]: «Durante muchos años habían sabido que el 25 de diciembre no era la fecha correcta, pero pensaban que esta fecha había estado asociada comúnmente al nacimiento del Salvador y que era apropiado hacer el bien a otros en todo momento.»
            - paragraph [ref=f16e188]:
              - text: —
              - link [ref=f16e189] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/pc/r4/lp-s/1200273077/1302/10
                - emphasis [ref=f16e190]: Los testigos de Jehová, proclamadores del Reino de Dios
              - text: ", 1993"
        - list [ref=f16e191]:
          - listitem [ref=f16e192]:
            - generic [ref=f16e193]: "1881"
            - heading "Primeras críticas" [level=3] [ref=f16e194]
            - paragraph [ref=f16e195]:
              - text: Según su propia retrospectiva,
              - link [ref=f16e196] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1102014249
                - emphasis [ref=f16e197]: El Reino de Dios ya está gobernando
                - text: ", capítulo 10"
              - text: ", en diciembre de 1881 la revista"
              - emphasis [ref=f16e198]: Watch Tower
              - text: ya relacionaba la Navidad con fiestas paganas. Pasarían más de cuarenta años antes de dejar de celebrarla.
            - figure [ref=f16e199]:
              - text: “
              - generic [ref=f16e200]:
                - generic [ref=f16e201]: Texto original
                - blockquote [ref=f16e202]:
                  - paragraph [ref=f16e203]: «Millones de personas paganas se hicieron cristianas. Pero el cambio era mayormente de nombre, pues los sacerdotes paganos se hicieron sacerdotes cristianos y las fiestas paganas adoptaron nombres cristianos, como es el caso de la Navidad.»
                - paragraph [ref=f16e204]:
                  - text: —
                  - emphasis [ref=f16e205]: Watch Tower
                  - text: ", diciembre de 1881, citada en"
                  - link [ref=f16e206] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1102014249
                    - emphasis [ref=f16e207]: El Reino de Dios ya está gobernando
                  - text: ", capítulo 10"
          - listitem [ref=f16e208]:
            - generic [ref=f16e209]: "1883"
            - heading "Otra fecha para el nacimiento" [level=3] [ref=f16e210]
            - paragraph [ref=f16e211]: Dos años después, la revista situaba el nacimiento de Jesús a principios de octubre. Hoy su web dice que la Biblia no revela la fecha del nacimiento.
          - listitem [ref=f16e212]:
            - generic [ref=f16e213]: "1926"
            - heading "La última Navidad en Betel" [level=3] [ref=f16e214]
            - paragraph [ref=f16e215]:
              - emphasis [ref=f16e216]: Proclamadores
              - text: señala la de 1926 como la última Navidad celebrada en Brooklyn, y menciona que también se dejó en las sucursales de Inglaterra y Suiza. En aquella época todavía se llamaban Estudiantes de la Biblia; el nombre de Testigos de Jehová llegó en 1931.
          - listitem [ref=f16e217]:
            - generic [ref=f16e218]: "1927"
            - heading "Dejar de celebrarla" [level=3] [ref=f16e219]
            - paragraph [ref=f16e220]:
              - text: La historia oficial cita el artículo «El origen de la Navidad», publicado en
              - emphasis [ref=f16e221]: The Golden Age
              - text: "del 14 de diciembre de 1927. Decía que era una fiesta pagana que fomentaba la idolatría y terminaba así:"
            - figure [ref=f16e222]:
              - text: “
              - generic [ref=f16e223]:
                - generic [ref=f16e224]: Texto original
                - blockquote [ref=f16e225]:
                  - paragraph [ref=f16e226]: «El hecho de que el mundo, la carne y el Diablo quieran que se perpetúe y celebre es un argumento definitivo y concluyente para que quienes están dedicados por completo al servicio de Jehová no la celebren.»
                - paragraph [ref=f16e227]:
                  - text: —
                  - emphasis [ref=f16e228]: The Golden Age
                  - text: ", 14 de diciembre de 1927, citada en"
                  - link [ref=f16e229] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1102014249
                    - emphasis [ref=f16e230]: El Reino de Dios ya está gobernando
                  - text: ", capítulo 10"
            - paragraph [ref=f16e231]: Ese año, en Betel ya no hubo Navidad. Y no volvió a haberla.
          - listitem [ref=f16e232]:
            - generic [ref=f16e233]: "1928"
            - heading "El mensaje llega por radio" [level=3] [ref=f16e234]
            - paragraph [ref=f16e235]:
              - text: En diciembre de 1928, Richard H. Barber dio por radio un discurso contra la Navidad. Se publicó en
              - emphasis [ref=f16e236]: The Golden Age
              - text: "del 12 de diciembre con el título «La Navidad: su origen y propósito»."
            - figure [ref=f16e237]:
              - text: “
              - generic [ref=f16e238]:
                - generic [ref=f16e239]: Texto original
                - blockquote [ref=f16e240]:
                  - paragraph [ref=f16e241]: «A fin de ocultar la importancia del rescate, Satanás […] ha enseñado a la gente a dar más importancia al nacimiento del niño Jesús que a la muerte del hombre Jesús.»
                - paragraph [ref=f16e242]:
                  - text: —
                  - emphasis [ref=f16e243]: The Golden Age
                  - text: ", 12 de diciembre de 1928, citada en"
                  - link [ref=f16e244] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1102014249
                    - emphasis [ref=f16e245]: El Reino de Dios ya está gobernando
                  - text: ", capítulo 10"
          - listitem [ref=f16e246]:
            - generic [ref=f16e247]: "1955"
            - heading "La Navidad o el favor de Dios" [level=3] [ref=f16e248]
            - paragraph [ref=f16e249]:
              - text: En 1955,
              - emphasis [ref=f16e250]: La Atalaya
              - text: "lo planteaba como una elección entre la Navidad y Dios:"
            - figure [ref=f16e251]:
              - text: “
              - generic [ref=f16e252]:
                - generic [ref=f16e253]: Texto original
                - blockquote [ref=f16e254]:
                  - paragraph [ref=f16e255]: «De modo que es un caso de escoger entre el aceptar la Navidad con su espíritu y perder a Dios, o aceptar a Dios y recibir su espíritu y favor y perder la Navidad. No debiera ser difícil escoger lo correcto.»
                - paragraph [ref=f16e256]:
                  - text: —
                  - link [ref=f16e257] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/pc/r4/lp-s/1200023272/263/28
                    - emphasis [ref=f16e258]: La Atalaya
                    - text: ", 15 de diciembre de 1955"
                  - text: ", «El origen de la Navidad y de su espíritu»"
            - paragraph [ref=f16e259]: Entre 1926 y 1955, la Navidad pasó de celebrarse en la sede de la organización a presentarse como una decisión que afectaba a la relación con Dios.
          - listitem [ref=f16e260]:
            - generic [ref=f16e261]: Hoy
            - paragraph [ref=f16e262]:
              - text: "Las publicaciones actuales hablan de situaciones muy concretas: qué hacer cuando te felicitan, si se pueden aceptar regalos, qué pasa si tu pareja quiere celebrar o si tus hijos sienten que se pierden algo. Lo explica el capítulo"
              - link "«Adore a Dios como él quiere»" [ref=f16e263] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/libros/curso-biblico/adorar-dios-como-quiere/
              - text: ", párrafos 13-17."
      - region [ref=f16e264]:
        - generic [ref=f16e265]:
          - generic [ref=f16e267]: "4"
          - heading "¿Nació Jesús el 25 de diciembre?" [level=2] [ref=f16e268]
        - paragraph [ref=f16e269]:
          - text: No se sabe. Los evangelios no dan ninguna fecha, y el detalle de los pastores en el campo no basta para calcularla. El historiador Andrew McGowan lo explica en
          - link "«How December 25 Became Christmas»" [ref=f16e270] [cursor=pointer]:
            - /url: https://www.biblicalarchaeology.org/daily/people-cultures-in-the-bible/jesus-historical-jesus/how-december-25-became-christmas/
          - text: ", donde repasa cómo se fue formando la tradición:"
        - list [ref=f16e271]:
          - listitem [ref=f16e272]:
            - strong [ref=f16e273]: Hacia el año 200.
            - text: Clemente de Alejandría recogía varios cálculos sobre el nacimiento, y ninguno era el 25 de diciembre.
          - listitem [ref=f16e274]:
            - strong [ref=f16e275]: Siglo IV.
            - text: Ya se celebraba el 25 de diciembre en Occidente y el 6 de enero en Oriente.
          - listitem [ref=f16e276]:
            - strong [ref=f16e277]: Mediados del siglo IV.
            - text: Un almanaque romano sitúa el nacimiento de Cristo en Belén el 25 de diciembre.
        - paragraph [ref=f16e278]:
          - text: "En esto coinciden los Testigos y los historiadores: no se conoce la fecha exacta del nacimiento de Jesús. En la Iglesia católica, el 25 de diciembre es la fecha de la celebración litúrgica, no una fecha histórica demostrada."
          - link "Juan Pablo II la llamó «convencional»" [ref=f16e279] [cursor=pointer]:
            - /url: https://www.vatican.va/content/john-paul-ii/es/audiences/1993/documents/hf_jp-ii_aud_19931222.html
          - text: y explicó que la Navidad conmemora el nacimiento de Jesús.
      - region [ref=f16e280]:
        - generic [ref=f16e281]:
          - generic [ref=f16e283]: "5"
          - heading "¿Se eligió esa fecha para sustituir una fiesta pagana?" [level=2] [ref=f16e284]
        - paragraph [ref=f16e285]:
          - text: Es la explicación más conocida, pero los historiadores no se ponen de acuerdo. El investigador C. P. E. Nothaft repasa las dos grandes teorías en la revista
          - link [ref=f16e286] [cursor=pointer]:
            - /url: https://www.cambridge.org/core/journals/church-history/article/abs/origins-of-the-christmas-date-some-recent-trends-in-historical-research/3767138672A4C2DFBED6BD1B004FB78A
            - emphasis [ref=f16e287]: Church History
            - text: (2012)
          - text: ":"
        - list [ref=f16e288]:
          - listitem [ref=f16e289]:
            - strong [ref=f16e290]: Las fiestas del sol.
            - text: La fecha coincide con celebraciones romanas dedicadas al sol, y la Navidad comparte el simbolismo de la luz. Pero eso no demuestra quién eligió la fecha ni por qué.
          - listitem [ref=f16e291]:
            - strong [ref=f16e292]: Los cálculos de los propios cristianos.
            - text: Algunos situaban la concepción de Jesús el 25 de marzo. Nueve meses después, sale el 25 de diciembre.
        - paragraph [ref=f16e293]: Nothaft propone tener en cuenta las dos explicaciones a la vez.
        - paragraph [ref=f16e294]: Los Testigos, por su parte, dan el origen pagano de la fiesta por establecido, y es uno de los motivos principales por los que no la celebran.
      - region [ref=f16e295]:
        - generic [ref=f16e296]:
          - generic [ref=f16e298]: "6"
          - heading "¿Y el árbol, los regalos y las demás costumbres?" [level=2] [ref=f16e299]
        - paragraph [ref=f16e300]: No todo en la Navidad tiene el mismo origen. La fecha, el árbol y las tarjetas de felicitación tienen historias distintas.
        - paragraph [ref=f16e301]:
          - text: Muchas de las costumbres que hoy nos parecen de toda la vida son bastante recientes. El
          - link "Victoria and Albert Museum" [ref=f16e302] [cursor=pointer]:
            - /url: https://www.vam.ac.uk/articles/victorian-christmas-traditions
          - text: "explica cómo se popularizó el árbol de Navidad en el Reino Unido en el siglo XIX: en 1848 se publicó una ilustración de la reina Victoria y el príncipe Alberto con su familia alrededor de un árbol, y la imagen se hizo enormemente popular."
        - paragraph [ref=f16e303]:
          - text: La
          - link "web de los Testigos" [ref=f16e304] [cursor=pointer]:
            - /url: https://www.jw.org/es/ense%C3%B1anzas-b%C3%ADblicas/preguntas/qu%C3%A9-dice-la-biblia-acerca-de-la-navidad/
          - text: relaciona los regalos, las luces y el árbol con prácticas anteriores al cristianismo. Los historiadores suelen estudiar cada costumbre por separado, porque cada una tiene su propia historia y su propia época.
      - region [ref=f16e305]:
        - generic [ref=f16e306]:
          - generic [ref=f16e308]: "7"
          - heading "¿Por qué otros cristianos sí la celebran?" [level=2] [ref=f16e309]
        - paragraph [ref=f16e310]:
          - text: Porque para ellos la Navidad no va de acertar con la fecha. El
          - link "Catecismo de la Iglesia católica (§§525-526)" [ref=f16e311] [cursor=pointer]:
            - /url: https://www.vatican.va/archive/catechism_sp/p122a3p3_sp.html
          - text: la presenta como la celebración de que Dios se hizo hombre, y la relaciona con la humildad y con la vida de cada creyente.
        - paragraph [ref=f16e312]: La diferencia de fondo está en cómo ve cada uno la tradición y qué considera una forma válida de honrar a Dios.
        - paragraph [ref=f16e313]:
          - text: Y hay quien la celebra sin ser creyente. El escritor Jonathan Holloway cuenta en
          - link "«An Atheist's Christmas»" [ref=f16e314] [cursor=pointer]:
            - /url: https://www.thinkingfaith.org/articles/20121220_1.htm
          - text: "que, siendo ateo, la Navidad empezó a significar algo para él cuando tuvo hijos: volver a casa, reunirse con la familia, mantener las tradiciones."
        - paragraph [ref=f16e315]: Por eso, ante la misma invitación a cenar en Nochebuena, una persona ve una reunión familiar y otra, una celebración religiosa. Entender eso evita muchos malentendidos en las familias.
      - region [ref=f16e316]:
        - generic [ref=f16e317]:
          - generic [ref=f16e318]:
            - generic [ref=f16e319]:
              - generic [ref=f16e321]: "8"
              - heading "¿Qué pasa cuando llega la Navidad al colegio?" [level=2] [ref=f16e322]
            - paragraph [ref=f16e323]: Cuando en clase se preparan villancicos, adornos o una función de Navidad, el niño Testigo no participa. Y entonces hay que decidir qué hace mientras tanto y cómo se lo explica a sus compañeros.
          - figure [ref=f16e324]:
            - img "Ilustración de tres alumnos reunidos en un aula decorada con una guirnalda; un hilo verde pasa por la puerta hasta un pupitre vacío." [ref=f16e325]
        - article [ref=f16e327]:
          - paragraph [ref=f16e328]: Testimonio
          - heading "Jasmine y los villancicos" [level=3] [ref=f16e329]
          - paragraph [ref=f16e330]:
            - text: Jasmine Grew lo contó en su
            - link "declaración ante la Comisión Real de Investigación de Nueva Zelanda" [ref=f16e331] [cursor=pointer]:
              - /url: https://www.abuseincare.org.nz/__data/assets/pdf_file/0027/26658/witness-statement-of-jasmine-grew-1-june-2022.pdf
            - text: ", en 2022. Cuando en el colegio se reunían para cantar villancicos, a ella no la dejaban estar. La llevaban a otra sala. Lo recuerda como una experiencia humillante."
        - generic [ref=f16e332]:
          - heading "Lo que publica la organización" [level=3] [ref=f16e333]
          - paragraph [ref=f16e334]:
            - text: El folleto
            - link [ref=f16e335] [cursor=pointer]:
              - /url: https://www.jw.org/es/biblioteca/folletos/Los-testigos-de-Jehov%C3%A1-y-la-educaci%C3%B3n/El-desaf%C3%ADo-que-supone-la-pluralidad-religiosa/
              - emphasis [ref=f16e336]: Los testigos de Jehová y la educación
            - text: cuenta otra cosa. Brian, un niño de diez años, dice que no se siente excluido y habla del tiempo que pasa con su familia en vacaciones. Otros niños hablan de los regalos y planes que tienen en otras épocas del año.
          - paragraph [ref=f16e337]: Son testimonios elegidos por la propia organización para explicar su postura. Lo que cuenta Jasmine, y lo que cuentan otros exmiembros, es bastante distinto. No sabemos cuántos niños lo viven de una manera u otra, pero sí que la versión de las revistas no es la única.
        - generic [ref=f16e338]:
          - heading "La Navidad se vive de maneras distintas" [level=3] [ref=f16e339]
          - paragraph [ref=f16e340]:
            - text: La Navidad tiene hoy un alcance amplio, también fuera de las comunidades cristianas. Según
            - link "Pew Research Center" [ref=f16e341] [cursor=pointer]:
              - /url: https://www.pewresearch.org/short-reads/2026/02/12/which-countries-have-the-most-and-fewest-public-holidays/
            - text: ", en 2026 al menos 154 países reconocen el día de Navidad como festivo nacional. Ese dato habla de calendarios oficiales, no de cuántas personas la celebran. En India,"
            - link "una encuesta de Pew realizada en 2019" [ref=f16e342] [cursor=pointer]:
              - /url: https://www.pewresearch.org/religion/2021/06/29/diversity-and-pluralism/
            - text: encontró que casi uno de cada cinco hindúes, sijs y jainistas participa en festejos navideños.
          - paragraph [ref=f16e343]: Para algunas personas es una fiesta religiosa; para otras, una tradición cultural o familiar, y hay quienes no la celebran. El significado depende de cada persona y de su entorno. También cada familia puede valorar qué puede suponer para un niño quedarse al margen cuando sus compañeros viven una actividad como un momento compartido.
      - region [ref=f16e344]:
        - generic [ref=f16e345]:
          - generic [ref=f16e346]:
            - generic [ref=f16e347]:
              - generic [ref=f16e349]: "9"
              - heading "¿Pueden aceptar regalos o reunirse con la familia?" [level=2] [ref=f16e350]
            - paragraph [ref=f16e351]: Depende. Las publicaciones no prohíben todo contacto con la Navidad.
            - paragraph [ref=f16e352]:
              - text: El capítulo
              - link "«Adore a Dios como él quiere» (§§14-16)" [ref=f16e353] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/libros/curso-biblico/adorar-dios-como-quiere/
              - text: dice que se puede dar las gracias a quien te felicita y deja a la conciencia de cada uno aceptar algunos regalos. Si la familia quiere celebrar, aconseja ser respetuoso y pensarse bien si pasar ese tiempo con ellos.
            - paragraph [ref=f16e354]: Celebrar sigue sin estar permitido. Pero aceptar un regalo o contestar amablemente a una felicitación no es, sin más, saltarse la norma.
            - paragraph [ref=f16e355]:
              - text: Para quien lo vive, no siempre es fácil. En su estudio
              - link "Doing Tolerance" [ref=f16e356] [cursor=pointer]:
                - /url: https://www.lancaster.ac.uk/fass/resources/sociology-online-papers/papers/holden-doing-tolerance.pdf
              - text: "(p. 5), el sociólogo Andrew Holden recoge el caso de una mujer jubilada, Testigo, cuyos hijos no lo eran:"
          - figure [ref=f16e357]:
            - img "Ilustración de una mesa puesta para una comida familiar, con una silla vacía conectada por un hilo verde a la ventana." [ref=f16e358]
        - figure [ref=f16e359]:
          - text: “
          - generic [ref=f16e360]:
            - generic [ref=f16e361]: Texto original
            - blockquote [ref=f16e362]:
              - paragraph [ref=f16e363]: "«No poder celebrar la Navidad con ellos ni mandarles una tarjeta de cumpleaños se me hacía terriblemente difícil. De hecho, llegué a pensar: “¿De verdad merece la pena?”.»"
              - paragraph [ref=f16e364]: «Incluso ahora, mi hijo no me invita a su casa en las fechas señaladas porque sabe que no quiero tener que decirle que no.»
            - paragraph [ref=f16e365]:
              - text: — Andrew Holden,
              - link [ref=f16e366] [cursor=pointer]:
                - /url: https://www.lancaster.ac.uk/fass/resources/sociology-online-papers/papers/holden-doing-tolerance.pdf
                - emphasis [ref=f16e367]: Doing Tolerance
              - text: ", Universidad de Lancaster, p. 5 (traducción de la AEVTJ)"
        - paragraph [ref=f16e368]: "Si tienes un familiar Testigo, a veces sirve más preguntarle directamente que discutir sobre la doctrina: qué plan le haría sentirse cómodo, qué significa para él y cómo podéis seguir viéndoos."
      - region [ref=f16e369]:
        - generic [ref=f16e370]:
          - generic [ref=f16e372]: "10"
          - heading "¿Celebrar la Navidad puede tener consecuencias?" [level=2] [ref=f16e373]
        - paragraph [ref=f16e374]:
          - text: Sí, puede tenerlas. El manual interno para ancianos,
          - emphasis [ref=f16e375]: Shepherd the Flock of God
          - text: ", del que existe una"
          - link "copia de septiembre de 2025 publicada por terceros" [ref=f16e376] [cursor=pointer]:
            - /url: https://www.scribd.com/document/922803273/202509-sfg-E
          - text: ", incluye celebrar fiestas de «religión falsa» dentro del apartado de apostasía (apéndice A, §39). Es una de las faltas más graves para la organización."
        - paragraph [ref=f16e377]: El mismo párrafo aclara que no todas las fiestas tienen que ver directamente con la religión falsa ni obligan a formar un comité. Es decir, no todo gesto navideño acaba en expulsión. Pero la posibilidad está escrita.
        - paragraph [ref=f16e378]:
          - text: Si te han presionado o sancionado por celebrar la Navidad, lo que viviste cuenta, aunque el manual tenga matices. Si quieres,
          - link "cuéntanoslo" [ref=f16e379] [cursor=pointer]:
            - /url: /contacto/
          - text: .
      - region [ref=f16e380]:
        - generic [ref=f16e381]:
          - generic [ref=f16e383]: "11"
          - heading "La primera Navidad después de salir" [level=2] [ref=f16e384]
        - paragraph [ref=f16e385]: Cambiar de opinión sobre la Navidad no significa que vayas a sentirte cómodo celebrándola desde el primer día.
        - paragraph [ref=f16e386]:
          - text: En un
          - link "relato publicado en TIME en 2015" [ref=f16e387] [cursor=pointer]:
            - /url: https://time.com/3654731/grew-up-as-jehovahs-witness/
          - text: ", una mujer que creció como Testigo recuerda la primera vez que celebró la Navidad, a los doce años, en casa de su tía. Toda la familia la animaba a sentarse en las rodillas de Papá Noel:"
        - figure [ref=f16e388]:
          - text: “
          - generic [ref=f16e389]:
            - generic [ref=f16e390]: Texto original
            - blockquote [ref=f16e391]:
              - paragraph [ref=f16e392]: "«Lo había deseado toda mi vida: sentarme en las rodillas de Papá Noel y contarle mis deseos de Navidad. Pero me pareció horrible, pecaminoso.»"
              - paragraph [ref=f16e393]: «Tardé años en dejar de preguntarme si Jehová me estaba mirando.»
            - paragraph [ref=f16e394]:
              - text: "— «It Happened to Me: I Grew Up as a Jehovah's Witness», xoJane en"
              - link "TIME" [ref=f16e395] [cursor=pointer]:
                - /url: https://time.com/3654731/grew-up-as-jehovahs-witness/
              - text: ", 8 de enero de 2015 (traducción de la AEVTJ)"
        - paragraph [ref=f16e396]: No hay una forma correcta de hacerlo. Puedes celebrarlo por todo lo alto, ir poco a poco, quedarte con las costumbres que te gusten o seguir sin celebrar. La primera cena de Nochebuena o el primer árbol no tienen que demostrar nada. Y siempre puedes cambiar de idea.
      - region [ref=f16e397]:
