      - region [ref=f16e430]:
        - generic [ref=f16e431]:
          - paragraph [ref=f16e432]: La mirada de la AEVTJ
          - heading "Que nadie tenga que elegir entre su conciencia y su familia" [level=2] [ref=f16e433]
          - generic [ref=f16e434]:
            - paragraph [ref=f16e435]: Respetamos que cada uno viva su fe como quiera, también en Navidad. Lo que pedimos es que nadie tenga que celebrar en contra de su conciencia para demostrar que quiere a su familia. Y que nadie tenga que callarse sus dudas o su malestar para demostrar que es leal a su congregación.
            - paragraph [ref=f16e436]: "En el colegio y en casa, lo importante es escuchar a la persona que tienes delante, sobre todo si es un niño. Esta historia empezó con una Navidad en Brooklyn hace casi cien años. Hoy se juega en decisiones mucho más cercanas: una invitación, una cena familiar, una función de Navidad en el colegio."
          - paragraph [ref=f16e437]: Sigue leyendo
          - generic [ref=f16e438]:
