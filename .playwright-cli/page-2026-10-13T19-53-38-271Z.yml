          - heading "¿Por qué los Testigos de Jehová no celebran la Navidad?" [level=1] [ref=f16e51]
          - paragraph [ref=f16e52]:
            - text: Los Testigos de Jehová creen en Jesús, pero no celebran la Navidad. Su organización explica que Jesús pidió que se recordara su muerte y no dijo nada de celebrar su nacimiento, que la Biblia no da ninguna fecha para ese día y que muchas costumbres navideñas vienen de otras religiones. Así lo cuenta en su
            - link "respuesta oficial sobre la Navidad" [ref=f16e53] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-celebran-la-navidad/
            - text: .
