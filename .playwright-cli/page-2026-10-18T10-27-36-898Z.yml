      - region [ref=e119]:
        - generic [ref=e120]:
          - generic [ref=e121]:
            - generic [ref=e123]: "1"
            - heading "¿Cómo surgieron los Testigos de Jehová?" [level=2] [ref=e124]
            - paragraph [ref=e125]: Las raíces del movimiento actual están en grupos de estudio bíblico que surgieron en Pensilvania en la década de 1870. Entre sus figuras destacadas estuvo Charles Taze Russell. En 1931, quienes formaban parte de la organización adoptaron el nombre de Testigos de Jehová.
            - paragraph [ref=e126]: "Esta es solo una referencia breve: la historia completa, incluidos sus cambios de organización y de enseñanzas, merece una página propia."
          - img "Ilustración de una pequeña imprenta antigua junto a una pila de libros, unidos por un hilo verde." [ref=e130]
      - region [ref=e131]:
        - generic [ref=e132]:
          - generic [ref=e133]:
            - generic [ref=e135]: "2"
            - heading "¿En qué creen?" [level=2] [ref=e136]
            - paragraph [ref=e137]: "Creen en Jehová como Dios y en Jesús como su Hijo y Salvador. Se consideran cristianos, pero no aceptan la Trinidad: para ellos, Dios y Jesús son seres distintos. Esta es una de las diferencias principales con el catolicismo y muchas iglesias protestantes."
            - paragraph [ref=e138]: También creen que Dios acabará con el sufrimiento y que las personas podrán vivir para siempre en un paraíso en la Tierra. Esperan una resurrección de los muertos y no creen en un infierno de tormento eterno.
            - paragraph [ref=e139]:
              - text: La Biblia ocupa un lugar central en su vida. Utilizan habitualmente su propia traducción, la
              - emphasis [ref=e140]: Traducción del Nuevo Mundo
              - text: ", y estudian sus textos siguiendo las explicaciones de la organización."
          - img "Ilustración de un libro cerrado y una puerta entreabierta por la que entra luz, unidos por un hilo verde." [ref=e144]
      - region [ref=e145]:
        - generic [ref=e146]:
          - generic [ref=e147]:
            - generic [ref=e149]: "3"
            - heading "¿Quién los dirige?" [level=2] [ref=e150]
            - paragraph [ref=e151]: La organización está dirigida por el Cuerpo Gobernante, un grupo de hombres que orienta sus enseñanzas y su actividad mundial. Sus explicaciones de la Biblia sirven de referencia para las congregaciones, que son los grupos locales de Testigos.
            - paragraph [ref=e152]: "La organización tiene una dirección central: el Cuerpo Gobernante establece las enseñanzas y directrices comunes. En cada congregación, los ancianos las transmiten y las aplican al dirigir las reuniones, la predicación y los asuntos de disciplina religiosa. Así, la misma línea organizativa llega a las congregaciones de distintos países."
          - img "Ilustración de una mesa alargada al fondo con unas pocas figuras y muchas filas de sillas vacías delante, unidas a la mesa por un hilo verde." [ref=e156]
      - region [ref=e157]:
        - generic [ref=e158]:
          - generic [ref=e159]:
            - generic [ref=e161]: "4"
            - heading "¿Qué hacen en sus reuniones y por qué predican?" [level=2] [ref=e162]
            - paragraph [ref=e163]: Sus lugares de reunión se llaman Salones del Reino. Allí estudian la Biblia y sus publicaciones, escuchan discursos, oran y cantan. Las reuniones y la predicación forman parte habitual de su práctica religiosa.
            - paragraph [ref=e164]: Cuando llaman a una puerta o hablan con alguien en la calle, buscan compartir sus creencias y ofrecer un estudio de la Biblia. Lo hacen porque entienden que Jesús encargó a sus seguidores transmitir su mensaje.
          - img "Ilustración de un expositor de publicaciones en la acera unido por un hilo verde al pomo de la puerta de una casa." [ref=e168]
      - region [ref=e169]:
        - generic [ref=e170]:
          - generic [ref=e171]:
            - generic [ref=e173]: "5"
            - heading "¿Qué normas siguen en su vida cotidiana?" [level=2] [ref=e174]
            - paragraph [ref=e175]: "Su fe influye en decisiones que para otras personas pueden no tener relación con la religión. Algunos ejemplos ayudan a entenderlo:"
          - img "Ilustración de una tarta de cumpleaños con las velas apagadas y un regalo sin abrir apartado en el suelo, con el lazo verde suelto." [ref=e179]
        - generic [ref=e180]:
          - article [ref=e181]:
            - text: "01"
            - heading "Celebraciones" [level=3] [ref=e182]
            - paragraph [ref=e183]:
              - text: No celebran
              - link "cumpleaños" [ref=e184] [cursor=pointer]:
                - /url: /testigos-de-jehova/cumpleanos/
              - text: ni
              - link "Navidad" [ref=e185] [cursor=pointer]:
                - /url: /testigos-de-jehova/navidad/
              - text: "por motivos religiosos. Eso no significa que no celebren nada: pueden reunirse con familiares y amigos o celebrar una boda."
          - article [ref=e186]:
            - text: "02"
            - heading "Ropa y aspecto" [level=3] [ref=e187]
            - paragraph [ref=e188]: Para las reuniones y la predicación se espera una apariencia que consideren modesta y apropiada. Algunas pautas han cambiado, así que la imagen de hombres siempre afeitados y mujeres siempre con falda no describe todas las situaciones actuales.
          - article [ref=e189]:
            - text: "03"
            - heading "Pareja y familia" [level=3] [ref=e190]
            - paragraph [ref=e191]: Sus enseñanzas establecen normas sobre las relaciones sexuales, el matrimonio y el divorcio. Por eso, compartir o no la religión puede tener bastante peso en una relación de pareja.
          - article [ref=e192]:
            - text: "04"
            - heading "Política y guerras" [level=3] [ref=e193]
            - paragraph [ref=e194]: Defienden la neutralidad política y no participan en guerras. Lo entienden como parte de su compromiso religioso.
        - paragraph [ref=e196]: Estas pautas no abarcan todos los aspectos ni describen por sí solas cómo vive cada persona cada situación.
        - paragraph [ref=e197]:
          - link "Consulta la guía completa sobre normas y vida cotidiana" [ref=e198] [cursor=pointer]:
            - /url: /testigos-de-jehova/normas/
            - text: Consulta la guía completa sobre normas y vida cotidiana
            - generic [aria-hidden] [ref=e199]: →
      - region [ref=e200]:
        - generic [ref=e201]:
          - generic [ref=e202]:
            - generic [ref=e204]: "6"
            - heading "¿Qué ocurre con las transfusiones de sangre?" [level=2] [ref=e205]
            - paragraph [ref=e206]: Durante décadas, los Testigos de Jehová mantuvieron una postura restrictiva frente a las transfusiones por su interpretación de la Biblia. En septiembre de 2026, la organización cambió su postura sobre algunos componentes sanguíneos, aunque mantiene una distinción respecto a la sangre completa. La historia y el alcance de estos cambios requieren más contexto que el que cabe aquí.
            - link "Los Testigos de Jehová y su postura sobre la sangre ↗" [ref=e207] [cursor=pointer]:
              - /url: /testigos-de-jehova/sangre/
          - img "Ilustración de un vial de sangre con un hilo verde atado, símbolo de cuidado y confianza." [ref=e211]
      - note [ref=e213]:
        - paragraph [ref=e219]:
          - text: Si a ti o a un familiar os proponen una transfusión, el equipo que os atiende puede explicar qué componente recomienda, por qué y qué alternativas hay. Así podréis valorar la decisión con información clara sobre el caso concreto. En nuestra
          - link "guía de derechos sanitarios" [ref=e220] [cursor=pointer]:
            - /url: /guia-para-proteger-tus-derechos-sanitarios-en-caso-de-interferencia-familiar/
          - text: explicamos cómo comunicar la voluntad del paciente.
      - region [ref=e221]:
        - generic [ref=e222]:
          - generic [ref=e223]:
            - generic [ref=e225]: "7"
            - heading "¿Qué pasa si alguien deja de ser Testigo?" [level=2] [ref=e226]
            - paragraph [ref=e227]: Dejar de asistir a las reuniones, renunciar a la religión y ser expulsado no son la misma situación. La organización distingue entre ellas, y el trato que recibe la persona puede cambiar.
            - paragraph [ref=e228]: En caso de expulsión, la norma que la organización comunica a sus miembros es que no mantengan trato social con la persona; la convivencia con familiares que viven en el mismo hogar se trata de otra manera.
            - paragraph [ref=e229]:
              - text: "Ser expulsado puede tener consecuencias que van mucho más allá de dejar una religión. Según la norma de la organización, otros miembros dejan de mantener trato social con la persona; la convivencia con familiares del mismo hogar se trata de forma distinta. Para quienes tienen a padres, hermanos, hijos adultos o amistades cercanas dentro de la organización, especialmente si viven fuera del hogar, la expulsión puede suponer perder de golpe el contacto cotidiano con casi toda esa red. AEVTJ recibe testimonios de personas para quienes esto supone un antes y un después: no solo dejan una religión, también pueden perder casi toda su vida familiar y social dentro de la organización y tener que reconstruir su vida con una red de apoyo muy reducida. En nuestra"
              - link "guía para salir de los Testigos de Jehová" [ref=e230] [cursor=pointer]:
                - /url: /guia-para-salir-de-los-testigos-de-jehova/
              - text: explicamos estas situaciones y ofrecemos recursos.
          - img "Ilustración de una familia sentada a un extremo de la mesa y una silla vacía al otro, separadas por un hilo cortado." [ref=e234]
