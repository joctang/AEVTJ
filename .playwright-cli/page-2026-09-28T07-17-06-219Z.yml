                - paragraph [ref=e188]: Bienvenido al Portal de Transparencia de la Asociación Española de Víctimas de los Testigos de Jehová.
                - paragraph [ref=e189]: Este espacio ha sido creado para garantizar la claridad y accesibilidad de toda la información relevante sobre nuestra organización, promoviendo la confianza y el compromiso con nuestros socios, colaboradores y la sociedad en general.
