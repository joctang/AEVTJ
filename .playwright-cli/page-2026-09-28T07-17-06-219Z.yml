      - generic [ref=e319]:
        - heading "Sobre comportamientos inaceptables" [level=2] [ref=e320]
        - generic [ref=e321]:
          - generic [ref=e322]:
            - paragraph [ref=e323]: En la actual junta directiva de la Asociación Española de Víctimas de los testigos de Jehová -AEVTJ-, creemos en la consecución de nuestras metas sin violencia ni malos modales, como ya se ha comunicado en el apartado «nuestra misión», una de ellas es dar a conocer a la sociedad los comportamientos internos y desconocidos de la organización de los testigos de Jehová.
            - paragraph [ref=e324]: A pesar del daño recibido y que nuestro fuero interno nos lo demande, caeríamos en malas prácticas si participáramos en malos comportamientos, en tal caso estaríamos actuando de manera indecorosa y similar a la de ellos como cuando insultan a la sociedad en general, a las personas en particular o a las organizaciones religiosas de distinto origen con calificativos impresentables.
          - paragraph [ref=e325]: Es por tanto que invitamos a nuestros socios y simpatizantes a ganarles en comportamiento, modales, habla con respeto, derecho a la propiedad y libertad de culto.
          - generic [ref=e326]:
            - paragraph [ref=e327]: "Y por tanto, declaramos que:"
            - generic [ref=e328]:
              - heading "Siempre fomentamos" [level=3] [ref=e329]
              - list [ref=e330]:
                - listitem [ref=e331]:
                  - generic [aria-hidden] [ref=e332]: ✓
                  - generic [ref=e333]: Siempre fomentamos la concordia con los testigos de Jehová, aunque ellos mismos no nos hablen.
            - generic [ref=e334]:
              - heading "Nunca" [level=3] [ref=e335]
              - list [ref=e336]:
                - listitem [ref=e337]:
                  - generic [aria-hidden] [ref=e338]: ✕
                  - generic [ref=e339]: Nunca les insultaremos, incluso en las peores circunstancias, llamándolos de manera que no podamos demostrar.
                - listitem [ref=e340]:
                  - generic [aria-hidden] [ref=e341]: ✕
                  - generic [ref=e342]: Nunca les acusamos de cosas indemostrables, solo informamos a la sociedad de asuntos que pueden ser comprobados y contrastados.
                - listitem [ref=e343]:
                  - generic [aria-hidden] [ref=e344]: ✕
                  - generic [ref=e345]: Nunca fomentaremos ni incitaremos al odio a las personas bajo ningún concepto.
                - listitem [ref=e346]:
                  - generic [aria-hidden] [ref=e347]: ✕
                  - generic [ref=e348]: Nunca pintamos ni manchamos sus propiedades, ni tendremos la intención de destruir cualquier propiedad de los testigos de Jehová ni de su organización.
                - listitem [ref=e349]:
                  - generic [aria-hidden] [ref=e350]: ✕
