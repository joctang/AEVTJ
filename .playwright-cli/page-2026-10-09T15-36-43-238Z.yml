          - heading "¿Qué normas siguen los Testigos de Jehová?" [level=2] [ref=e67]
          - paragraph [ref=e68]: Las normas abarcan celebraciones, relaciones de pareja, participación política y otras decisiones personales. Por ejemplo, no celebran cumpleaños ni Navidad; mantienen neutralidad política y reservan las relaciones sexuales para el matrimonio. En temas como votar, estudiar en la universidad o beber alcohol, conviene explicar con cuidado qué dice la organización y qué decide cada persona.
          - paragraph [ref=e69]: No todas las pautas tienen el mismo alcance. En esta guía distinguimos lo que la organización publica, las decisiones que deja a cada miembro y las experiencias particulares.
          - link "Cómo explica la organización sus creencias y prácticas ↗" [ref=e70] [cursor=pointer]:
            - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/creencias-testigos-jehova/
