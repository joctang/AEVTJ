      - region [ref=e134]:
        - generic [ref=e135]:
          - generic [ref=e136]:
            - paragraph [ref=e137]: Celebraciones
            - heading "¿Celebran cumpleaños y Navidad?" [level=2] [ref=e138]
            - paragraph [ref=e139]: "No. Los Testigos de Jehová no celebran los cumpleaños ni la Navidad. Sus publicaciones presentan ambas celebraciones como incompatibles con la adoración que practican: en el caso de los cumpleaños, reconocen que la Biblia no los prohíbe expresamente; en el de Navidad, explican que la rechazan por su origen y por no aparecer como celebración cristiana en la Biblia."
            - paragraph [ref=e140]:
              - text: La diferencia importante está en las consecuencias internas. Una guía confidencial para ancianos de 2007 —copia archivada fuera del sitio oficial— indica que una persona
              - emphasis [ref=e141]: normalmente no sería expulsada solo por celebrar un cumpleaños
              - text: ", pero contempla esa medida si insiste en promoverlo y crear división. En cambio, el manual confidencial de ancianos de septiembre de 2025 clasifica celebrar fiestas religiosas falsas dentro del apartado de apostasía, aunque añade que no todas requieren formar un comité. Estos textos no permiten afirmar que cualquier celebración privada termine automáticamente en expulsión; sí muestran que no se trata simplemente de una costumbre que la organización considera indiferente."
            - paragraph [ref=e142]: La norma publicada y la experiencia de una persona pueden diferir en cómo se aplica el consejo, qué se entiende por promoción o qué medidas se toman. Por eso recogemos los testimonios concretos con fecha y contexto, sin convertirlos en una regla universal.
            - generic [ref=e143]:
              - link "La explicación oficial sobre cumpleaños ↗ ↗" [ref=e144] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/cumpleanos/
              - link "La explicación oficial sobre Navidad ↗ ↗" [ref=e145] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-celebran-la-navidad/
            - paragraph [ref=e146]:
              - strong [ref=e147]: "Fuentes internas consultadas:"
              - link "Correspondence Guidelines, 2007, pp. 29 y 63 (copia archivada) ↗" [ref=e148] [cursor=pointer]:
                - /url: https://wtsarchive.com/cfs/files/downloads/MLHN6FTPNL2JaiFpi/cg-E.pdf
              - text: ·
              - link "Shepherd the Flock of God, septiembre de 2025, apéndice A, §§38–39 (manual confidencial, copia alojada por terceros) ↗" [ref=e149] [cursor=pointer]:
                - /url: https://www.scribd.com/document/922803273/202509-sfg-E
              - text: .
          - complementary [ref=e150]:
            - strong [ref=e151]: La regla y su aplicación
            - paragraph [ref=e152]: La propia documentación distingue entre desaconsejar una celebración, aconsejar a una persona y abrir un proceso que pueda acabar en expulsión. No son lo mismo, y el caso concreto importa.
      - region [ref=e153]:
        - generic [ref=e154]:
          - generic [ref=e155]:
            - paragraph [ref=e156]: Noviazgo y matrimonio
            - heading "¿Pueden tener pareja de otra religión?" [level=2] [ref=e157]
            - paragraph [ref=e158]:
              - text: "La respuesta institucional es más concreta que un consejo genérico: la"
              - link "FAQ oficial sobre el noviazgo" [ref=e159] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/testigos-noviazgo/
              - text: dice que deben empezar una relación y casarse con alguien que también sea Testigo bautizado. Presenta el noviazgo como un paso hacia el matrimonio, y su interpretación de la Biblia reserva las relaciones sexuales para el matrimonio.
            - paragraph [ref=e160]: Eso describe la enseñanza publicada. No es una prohibición civil de relacionarse con personas ajenas a la religión, pero sí marca con quién se espera que un miembro bautizado forme pareja.
            - paragraph [ref=e161]: El manual confidencial para ancianos de septiembre de 2025 incluye la inmoralidad sexual entre los asuntos que pueden requerir un comité. Para miembros bautizados, una conducta que la organización clasifique así puede activar disciplina congregacional; la medida final depende de los hechos y de la evaluación del caso. La copia consultada es un documento interno alojado por terceros.
          - generic [ref=e162]:
            - text: La pregunta útil
            - strong [ref=e163]: ¿Qué dice la fuente y a quién va dirigida?
            - paragraph [ref=e164]: Una regla para el noviazgo entre miembros no describe automáticamente todos los matrimonios o familias mixtas.
      - region [ref=e165]:
        - generic [ref=e166]:
          - generic [ref=e167]:
            - paragraph [ref=e168]: Universidad y educación superior
            - heading "¿Pueden ir a la universidad?" [level=2] [ref=e169]
            - paragraph [ref=e170]:
              - strong [ref=e171]: Sí; hoy la organización afirma que es una decisión personal.
              - text: La
              - link "Atalaya de mayo de 2026" [ref=e172] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/revistas/atalaya-estudio-mayo-2026/C%C3%B3mo-tomar-buenas-decisiones-sobre-los-estudios-adicionales/
              - text: reconoce expresamente que publicaciones anteriores recomendaron no ir a la universidad. Añade que ningún cristiano, incluidos los ancianos, debería juzgar la decisión de un adulto. La actualización importa porque antes se comunicó una orientación claramente distinta.
            - heading "Qué decían antes las publicaciones" [level=3] [ref=e173]
            - paragraph [ref=e174]:
              - text: En
              - link "1989, un artículo decía que seguía siendo una decisión personal" [ref=e175] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/101989324
              - text: ", pero dedicaba varios párrafos a los riesgos morales y religiosos de la universidad y señalaba que muchos jóvenes cristianos habían decidido no asistir. En"
              - link "2005, La Atalaya advirtió a los padres sobre los peligros de la educación superior" [ref=e176] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/2005726
              - text: y orientó a los jóvenes hacia metas religiosas. En
              - link "2014" [ref=e177] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/402014442
              - text: contrapuso las metas que ofrece “este mundo” con servir más a Jehová; incluyó la historia de una mujer que dejó la universidad y afirmó que esta no podía aportar ciertos beneficios. El tono no equivale a una prohibición formal, pero sí desaconseja con fuerza esa opción.
            - paragraph [ref=e178]: La historia más completa, por tanto, no es «estaba prohibido» ni tampoco «siempre fue una elección neutral». La organización reconoce ahora el cambio de orientación. Para describir presión en una familia o congregación concreta, hay que aportar el testimonio y su contexto.
            - paragraph [ref=e179]:
              - strong [ref=e180]: "Fuentes primarias:"
              - link "¡Despertad!, 22-5-1989 ↗" [ref=e181] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/101989324
              - text: ·
              - link "La Atalaya, 1-10-2005 ↗" [ref=e182] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/2005726
              - text: ·
              - link "La Atalaya, 15-6-2014 ↗" [ref=e183] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/402014442
              - text: ·
              - link "La Atalaya, mayo de 2026 ↗" [ref=e184] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/revistas/atalaya-estudio-mayo-2026/C%C3%B3mo-tomar-buenas-decisiones-sobre-los-estudios-adicionales/
              - text: .
          - figure "Ilustración editorial. El apartado documenta el cambio entre la orientación histórica y la posición oficial de 2026." [ref=e185]:
            - img "Ilustración de una estudiante entrando en un aula universitaria con un hilo lima que avanza hacia el espacio abierto." [ref=e186]
      - region [ref=e188]:
        - generic [ref=e189]:
          - generic [ref=e190]:
            - paragraph [ref=e191]: Voto y neutralidad política
            - heading "¿Qué ocurre si un Testigo de Jehová vota?" [level=2] [ref=e192]
            - paragraph [ref=e193]:
              - text: La respuesta oficial actual tiene dos formulaciones que conviene leer juntas. La
              - link "FAQ sobre neutralidad" [ref=e194] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/neutralidad-pol%C3%ADtica/
              - text: afirma que no interfieren si alguien decide votar; en el mismo artículo, la organización dice que sus miembros “no votamos por ningún partido o candidato”. El mensaje institucional de neutralidad política es, por tanto, más amplio que la mera ausencia de afiliación partidista.
            - paragraph [ref=e195]:
              - text: Además, la orientación ha cambiado con el tiempo. En
              - link "1999, La Atalaya decía expresamente que cada Testigo podía decidir en conciencia si votar por un candidato" [ref=e196] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1999807
              - text: ; en países donde el voto era obligatorio, decía que cada cual debía decidir qué hacer y que lo escrito en la papeleta quedaba entre esa persona y Dios. La FAQ actual conserva el derecho de decidir, pero formula la neutralidad de manera más categórica.
            - paragraph [ref=e197]: "¿Implica votar expulsión? No encontramos una norma pública actual que establezca una expulsión automática por el mero acto de depositar una papeleta. En cambio, testimonios de exmiembros describen temor, presión o consecuencias cuando una participación política se interpretó como falta de neutralidad. Esas experiencias merecen documentarse caso por caso: no bastan por sí solas para demostrar que toda congregación aplica la misma sanción. Tampoco deben borrarse detrás de la frase institucional “no interferimos”."
            - paragraph [ref=e198]:
              - text: La neutralidad también se expresa en la negativa a participar en actos como
              - link "saludar a la bandera o cantar el himno" [ref=e199] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-que-no-participan-ceremonias-nacionalistas-bandera/
              - text: y en la objeción a
              - link "participar en guerras" [ref=e200] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-van-a-la-guerra/
              - text: . Las obligaciones legales y alternativas civiles dependen del país.
            - paragraph [ref=e201]:
              - strong [ref=e202]: "Fuentes comparadas:"
              - link "La Atalaya, 1-11-1999, “Preguntas de los lectores” ↗" [ref=e203] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1999807
              - text: ·
              - link "FAQ institucional vigente ↗" [ref=e204] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/neutralidad-pol%C3%ADtica/
              - text: .
          - complementary [ref=e205]:
            - strong [ref=e206]: Texto público y experiencia
            - paragraph [ref=e207]: La abstención mayoritaria aparece como una preferencia religiosa muy marcada; el castigo por votar no figura como automático en las fuentes públicas consultadas. La experiencia concreta puede revelar presión que una FAQ no describe.
      - region [ref=e208]:
        - generic [ref=e209]:
          - figure "El baile no tiene una prohibición general publicada." [ref=e210]:
            - img "Ilustración de tres personas adultas bailando en una reunión social, unidas visualmente por un hilo lima." [ref=e211]
          - generic [ref=e213]:
            - paragraph [ref=e214]: Vida cotidiana
            - heading "Alcohol, baile y entretenimiento" [level=2] [ref=e215]
            - heading "¿Pueden beber alcohol?" [level=3] [ref=e216]
            - paragraph [ref=e217]:
              - text: Sí. La
              - link "explicación oficial sobre el alcohol" [ref=e218] [cursor=pointer]:
                - /url: https://www.jw.org/es/ense%C3%B1anzas-b%C3%ADblicas/preguntas/beber-alcohol-pecado/
              - text: permite beber con moderación y condena la embriaguez. También señala situaciones en las que una persona decide abstenerse. Por tanto, ni «todo alcohol está prohibido» ni «da igual cuánto se beba» resumen su postura.
            - paragraph [ref=e219]: El manual confidencial para ancianos distingue un episodio privado aislado —para el que puede bastar consejo— de la embriaguez repetida o notoria, que puede requerir un comité. No indica que cualquier consumo o incidente implique expulsión.
            - heading "¿Pueden bailar, escuchar música o ver películas?" [level=3] [ref=e220]
            - paragraph [ref=e221]:
              - text: No consta una prohibición general del baile. La organización dice que
              - link "no mantiene una lista universal de películas, canciones o libros prohibidos" [ref=e222] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/censura-entretenimiento-testigos-de-jehov%C3%A1/
              - text: . Publica principios morales para elegir entretenimiento, mientras que la valoración de una obra o un baile concreto queda ligada a la conciencia, la familia y el contexto.
      - region [ref=e223]:
        - generic [ref=e224]:
          - paragraph [ref=e225]: Otras prácticas relevantes
          - heading "Predicación, ropa y decisiones médicas" [level=2] [ref=e226]
          - generic [ref=e227]:
            - article [ref=e228]:
              - text: "01"
              - heading "Predicación" [level=3] [ref=e229]
              - paragraph [ref=e230]:
                - text: La organización presenta hablar de sus creencias como parte importante de la vida religiosa y de la educación de los hijos. Su manual interno prevé registrar mensualmente la actividad de predicación de cada publicador. Eso no demuestra que todos dediquen el mismo tiempo ni que un menor haya elegido bautizarse.
                - link "Ver la FAQ institucional ↗" [ref=e231] [cursor=pointer]:
                  - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/testigos-jehova-obligan-hijos-religion-predicar/
                - text: ·
                - link "Manual interno de 2025, copia externa ↗" [ref=e232] [cursor=pointer]:
                  - /url: https://www.scribd.com/document/922803273/202509-sfg-E
            - article [ref=e233]:
              - text: "02"
              - heading "Ropa y aspecto" [level=3] [ref=e234]
              - paragraph [ref=e235]:
                - text: Existen pautas de arreglo para reuniones y actividades, pero algunas instrucciones cambiaron en 2023 y 2024. Afirmaciones como «ningún hombre lleva barba» o «ninguna mujer usa pantalón» no describen bien la situación actual.
