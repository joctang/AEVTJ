        - generic [ref=f23e63]:
          - heading "¿Qué normas siguen los Testigos de Jehová?" [level=2] [ref=f23e64]
          - paragraph [ref=f23e65]: Hay cosas que no celebran, otras en las que la organización marca una pauta clara y otras que, al menos sobre el papel, decide cada uno.
          - group "Filtrar temas" [ref=f23e66]:
            - button "Todos" [pressed] [ref=f23e67] [cursor=pointer]
            - button "No celebran o rechazan" [ref=f23e68] [cursor=pointer]
            - button "Lo que espera la organización" [ref=f23e69] [cursor=pointer]
            - button "Decide cada persona" [ref=f23e70] [cursor=pointer]
          - paragraph [ref=f23e71]: Mostrando los 10 temas.
          - list [ref=f23e72]:
            - listitem [ref=f23e73]:
              - generic [ref=f23e74]: No los celebran
              - heading "Cumpleaños" [level=3] [ref=f23e75]
              - paragraph [ref=f23e76]: No celebran los cumpleaños.
              - paragraph [ref=f23e78]: La propia organización reconoce que la Biblia no los prohíbe directamente. Llega a esa conclusión por cómo interpreta algunos relatos bíblicos.
              - link "Leer sobre cumpleaños" [ref=f23e80] [cursor=pointer]:
                - /url: /testigos-de-jehova/cumpleanos/
            - listitem [ref=f23e81]:
              - generic [ref=f23e82]: No la celebran
              - heading "Navidad" [level=3] [ref=f23e83]
              - paragraph [ref=f23e84]: No celebran la Navidad.
              - paragraph [ref=f23e86]: Dicen que muchas costumbres navideñas tienen origen pagano. Además, Jesús pidió que se recordara su muerte y no dijo nada de celebrar su nacimiento.
              - generic [ref=f23e87]:
                - link "Leer sobre Navidad" [ref=f23e88] [cursor=pointer]:
                  - /url: /testigos-de-jehova/navidad/
                - link "Otras fiestas" [ref=f23e89] [cursor=pointer]:
                  - /url: /testigos-de-jehova/celebraciones/
            - listitem [ref=f23e90]:
              - generic [ref=f23e91]: "La pauta: otro Testigo bautizado"
              - heading "Pareja y sexualidad" [level=3] [ref=f23e92]
              - paragraph [ref=f23e93]: La organización espera que la pareja sea otro Testigo bautizado.
              - paragraph [ref=f23e95]: También enseña que el sexo es solo para el matrimonio. Dice que cada uno decide con quién sale, pero siempre dentro de esas pautas.
              - link "Ver pareja y matrimonio" [ref=f23e97] [cursor=pointer]:
                - /url: "#pareja"
            - listitem [ref=f23e98]:
              - generic [ref=f23e99]: Decisión personal
              - heading "Universidad" [level=3] [ref=f23e100]
              - paragraph [ref=f23e101]: Hoy dicen que es una decisión de cada adulto.
              - paragraph [ref=f23e103]: Durante años, sus revistas desaconsejaron ir. En mayo de 2026 la organización lo reconoció y dejó la decisión a cada uno.
              - link "Ver universidad" [ref=f23e105] [cursor=pointer]:
                - /url: "#estudios"
            - listitem [ref=f23e106]:
              - generic [ref=f23e107]: Neutralidad política
              - heading "Voto y política" [level=3] [ref=f23e108]
              - paragraph [ref=f23e109]: Piden neutralidad política. Oficialmente, no se meten si alguien vota.
              - paragraph [ref=f23e111]: No apoyan a partidos ni candidatos y no se presentan a cargos públicos. En la práctica, muchos Testigos no votan.
              - link "Ver voto y política" [ref=f23e113] [cursor=pointer]:
                - /url: "#politica"
            - listitem [ref=f23e114]:
              - generic [ref=f23e115]: Con moderación
              - heading "Alcohol" [level=3] [ref=f23e116]
              - paragraph [ref=f23e117]: Pueden beber, pero emborracharse se considera pecado.
              - paragraph [ref=f23e119]: Beber con moderación está permitido. Si alguien se emborracha a menudo o en público, el manual interno prevé que intervengan los ancianos.
              - link "Ver alcohol y tabaco" [ref=f23e121] [cursor=pointer]:
                - /url: "#vida-cotidiana"
            - listitem [ref=f23e122]:
              - generic [ref=f23e123]: No fumar
              - heading "Tabaco" [level=3] [ref=f23e124]
              - paragraph [ref=f23e125]: Fumar se considera pecado.
              - paragraph [ref=f23e127]: También el tabaco de mascar, el rapé y los cigarrillos electrónicos con nicotina, aunque la Biblia no habla del tabaco.
              - link "Ver alcohol y tabaco" [ref=f23e129] [cursor=pointer]:
                - /url: "#vida-cotidiana"
            - listitem [ref=f23e130]:
              - generic [ref=f23e131]: Criterio personal
              - heading "Baile y entretenimiento" [level=3] [ref=f23e132]
              - paragraph [ref=f23e133]: No hay una prohibición general del baile ni una lista de películas o canciones prohibidas.
              - paragraph [ref=f23e135]: La organización da unos principios y cada uno decide qué ve, qué escucha o qué baila.
              - link "Ver baile y ocio" [ref=f23e137] [cursor=pointer]:
                - /url: "#entretenimiento"
            - listitem [ref=f23e138]:
              - generic [ref=f23e139]: Arreglo y modestia
              - heading "Ropa y aspecto" [level=3] [ref=f23e140]
              - paragraph [ref=f23e141]: Para las reuniones y la predicación piden ir arreglados y con ropa modesta.
              - paragraph [ref=f23e143]: "Algunas pautas cambiaron en 2023 y 2024: hoy se permite la barba y que las mujeres lleven pantalón en algunas actividades."
              - link "Leer sobre vestimenta" [ref=f23e145] [cursor=pointer]:
                - /url: /testigos-de-jehova/vestimenta/
            - listitem [ref=f23e146]:
              - generic [ref=f23e147]: "Sangre completa: no"
              - heading "Sangre" [level=3] [ref=f23e148]
              - paragraph [ref=f23e149]: Siguen rechazando la sangre completa.
              - paragraph [ref=f23e151]: Desde septiembre de 2026, aceptar o donar glóbulos, plasma o plaquetas es una decisión de cada uno.
              - link "Ampliar información sobre sangre y transfusiones" [ref=f23e153] [cursor=pointer]:
                - /url: /testigos-de-jehova/sangre/
          - paragraph [ref=f23e154]: Lo que contamos sobre los ancianos y los comités sale de sus manuales internos, que hemos consultado en copias publicadas por terceros. Explican lo que puede pasar, aunque no todas las congregaciones lo aplican igual.
          - link "Cómo explica la organización sus creencias y prácticas ↗" [ref=f23e155] [cursor=pointer]:
            - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/creencias-testigos-jehova/
      - region [ref=f23e156]:
        - generic [ref=f23e157]:
          - paragraph [ref=f23e158]: Para entendernos
          - heading "¿Qué significa cada norma en la vida real?" [level=2] [ref=f23e159]
          - generic [ref=f23e160]:
            - article [ref=f23e161]:
              - heading "Lo que dice la organización" [level=3] [ref=f23e162]
              - paragraph [ref=f23e163]: Lo que publica en sus revistas, en su web y en sus manuales. Siempre te decimos de dónde sale.
            - article [ref=f23e164]:
              - heading "Lo que decide cada uno" [level=3] [ref=f23e165]
              - paragraph [ref=f23e166]: En algunos temas, la organización dice que es una decisión de conciencia. Pero entre lo que se dice y la presión que se siente en la congregación puede haber mucha distancia.
            - article [ref=f23e167]:
              - heading "Lo que vive cada familia" [level=3] [ref=f23e168]
              - paragraph [ref=f23e169]: Los testimonios cuentan cómo se aplicó una norma en un caso concreto. No sirven para hacer estadísticas, pero sí para entender lo que las revistas no cuentan.
          - paragraph [ref=f23e170]: "Y una aclaración: hablamos de normas religiosas, no de leyes. Lo que dice la ley depende de cada país."
      - region [ref=f23e171]:
        - generic [ref=f23e173]:
          - paragraph [ref=f23e174]: Celebraciones
          - heading "¿Celebran cumpleaños y Navidad?" [level=2] [ref=f23e175]
          - paragraph [ref=f23e176]:
            - text: No. Los Testigos de Jehová
            - strong [ref=f23e177]: no celebran los cumpleaños ni la Navidad
            - text: ". Tampoco muchas otras fiestas populares. Te explicamos por qué y lo que cuentan quienes crecieron sin ellas:"
          - generic [ref=f23e178]:
            - link "Por qué no celebran los cumpleaños ↗" [ref=f23e179] [cursor=pointer]:
              - /url: /testigos-de-jehova/cumpleanos/
            - link "Por qué no celebran la Navidad ↗" [ref=f23e180] [cursor=pointer]:
              - /url: /testigos-de-jehova/navidad/
            - link "Otras fiestas ↗" [ref=f23e181] [cursor=pointer]:
              - /url: /testigos-de-jehova/celebraciones/
      - region [ref=f23e182]:
        - generic [ref=f23e184]:
          - paragraph [ref=f23e185]: Noviazgo y matrimonio
          - heading "¿Puede un Testigo de Jehová salir con alguien de otra religión?" [level=2] [ref=f23e186]
          - paragraph [ref=f23e187]:
            - strong [ref=f23e188]: La organización recomienda que un Testigo bautizado salga solo con otro Testigo bautizado.
            - text: Para ellos, empezar una relación es un paso serio que debe llevar al matrimonio.
          - paragraph [ref=f23e189]: "Su web dice que cada uno decide si quiere tener pareja y con quién, siempre dentro de sus pautas bíblicas. En la práctica, esa libertad tiene un límite claro: lo que se espera es que la pareja comparta la religión y esté bautizada."
          - paragraph [ref=f23e190]: "Si ya estás casado y tu pareja no es Testigo, la cosa cambia: la organización aconseja no separarse por motivos religiosos."
          - paragraph [ref=f23e191]:
            - strong [ref=f23e192]: "Fuentes:"
            - link "Qué dice la organización sobre el noviazgo ↗" [ref=f23e193] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/testigos-noviazgo/
            - text: ·
            - link "Qué dice sobre matrimonios en los que solo una persona es Testigo ↗" [ref=f23e194] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/familias/
            - text: .
      - region [ref=f23e195]:
        - generic [ref=f23e196]:
          - generic [ref=f23e197]:
            - paragraph [ref=f23e198]: Universidad y educación superior
            - heading "¿Pueden ir a la universidad?" [level=2] [ref=f23e199]
            - paragraph [ref=f23e200]:
              - strong [ref=f23e201]: Sí. Hoy la organización dice que es una decisión personal.
              - text: Pero no siempre fue así, y ella misma lo reconoce.
              - link "La Atalaya de mayo de 2026" [ref=f23e202] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/revistas/atalaya-estudio-mayo-2026/C%C3%B3mo-tomar-buenas-decisiones-sobre-los-estudios-adicionales/
              - text: admite que publicaciones anteriores recomendaban no ir a la universidad, y pide que nadie, tampoco los ancianos, juzgue la decisión de un adulto.
            - heading "Qué decían antes las publicaciones" [level=3] [ref=f23e203]
            - paragraph [ref=f23e204]:
              - text: En
              - link "1989, ¡Despertad! decía que era una decisión personal" [ref=f23e205] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/101989324
              - text: ", pero dedicaba varios párrafos a advertir de los peligros morales y espirituales y presentaba no ir como lo que ya hacían muchos jóvenes cristianos. El mensaje venía a ser: puedes elegir, pero si vas, pones en riesgo tu fe."
            - paragraph [ref=f23e206]:
              - text: En
              - link "2005, La Atalaya advertía a los padres de los peligros de la educación superior" [ref=f23e207] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/2005726
              - text: y animaba a los jóvenes a buscar metas religiosas. En
              - link "2014" [ref=f23e208] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/402014442
              - text: contraponía las metas de “este mundo” con servir más a Jehová, e incluía la historia de una mujer que había dejado la universidad.
            - paragraph [ref=f23e209]: Nunca fue una prohibición formal. Pero un joven que leía esos artículos tenía claro cuál era la opción que se esperaba de él. Quien dejó de estudiar siguiendo esos consejos lo hizo con esa presión encima, aunque hoy la organización diga que siempre fue una decisión personal.
            - paragraph [ref=f23e210]:
              - strong [ref=f23e211]: "Fuentes primarias:"
              - link "¡Despertad!, 22-5-1989 ↗" [ref=f23e212] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/101989324
              - text: ·
              - link "La Atalaya, 1-10-2005 ↗" [ref=f23e213] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/2005726
              - text: ·
              - link "La Atalaya, 15-6-2014 ↗" [ref=f23e214] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/402014442
              - text: ·
              - link "La Atalaya, mayo de 2026 ↗" [ref=f23e215] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/revistas/atalaya-estudio-mayo-2026/C%C3%B3mo-tomar-buenas-decisiones-sobre-los-estudios-adicionales/
              - text: .
          - figure [ref=f23e216]:
            - img "Ilustración de una estudiante entrando en un aula universitaria con un hilo lima que avanza hacia el espacio abierto." [ref=f23e217]
      - region [ref=f23e218]:
        - generic [ref=f23e220]:
          - paragraph [ref=f23e221]: Voto y neutralidad política
          - heading "¿Pueden votar los Testigos de Jehová?" [level=2] [ref=f23e222]
          - paragraph [ref=f23e223]:
            - text: No hay ninguna norma oficial que les prohíba votar.
            - strong [ref=f23e224]: Lo que pide la organización es neutralidad política, y en la práctica muchos Testigos no votan.
            - text: Su
            - link "web" [ref=f23e225] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/neutralidad-pol%C3%ADtica/
            - text: dice que no apoyan a ningún partido ni candidato, que no se presentan a cargos públicos y que «tampoco interferimos si alguien decide votar».
          - figure [ref=f23e226]:
            - img "Ilustración de una persona depositando una papeleta en blanco en una urna; un hilo verde la conecta con su mano." [ref=f23e227]
          - heading "¿Por qué muchos no votan?" [level=3] [ref=f23e228]
          - paragraph [ref=f23e229]: "Dan varias razones: que los cristianos no son «parte del mundo», que son embajadores del Reino de Dios, que si votas a alguien te haces responsable de lo que haga, que la política divide a las congregaciones y que, si son neutrales, pueden predicar a cualquiera."
          - paragraph [ref=f23e230]:
            - text: Pero no lo presentan como un mandato bíblico. En
            - link "1999, La Atalaya" [ref=f23e231] [cursor=pointer]:
              - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1999807
            - text: decía que no veía nada en la Biblia contra votar en sí y que «cada Testigo es responsable de tomar una decisión en conciencia y basada en la Biblia».
          - heading "¿Qué pasa si votan?" [level=3] [ref=f23e232]
          - paragraph [ref=f23e233]:
            - text: Ninguna norma escrita dice que votar sea motivo de expulsión. Pero algunos exmiembros cuentan otra cosa. Uno de los testimonios mejor documentados es una
            - link "presentación escrita ante un comité del Parlamento australiano (Submission 53)" [ref=f23e234] [cursor=pointer]:
              - /url: https://www.aph.gov.au/DocumentStore.ashx?id=fb4004b6-b469-4b00-b7cf-e389796ff716&subId=667532
            - text: ", que afirma que votar puede acabar en expulsión y rechazo social. Es el testimonio de quien la presentó, no una conclusión del comité."
          - paragraph [ref=f23e235]:
            - text: Si votaste y en tu congregación te dijeron o te hicieron algo por ello,
            - link "cuéntanoslo" [ref=f23e236] [cursor=pointer]:
              - /url: /contacto/
            - text: . Con la fecha, el país y lo que pasó, podemos documentarlo.
          - heading "¿Y en España?" [level=3] [ref=f23e237]
          - paragraph [ref=f23e238]: En España votar no es obligatorio, así que el problema no se plantea igual. En los países donde sí lo es, La Atalaya de 1999 decía que cada Testigo decide en conciencia y que «lo que haga una vez allí queda entre él y su Creador».
          - heading "¿Y la bandera, el himno y la guerra?" [level=3] [ref=f23e239]
          - paragraph [ref=f23e240]:
            - text: La neutralidad también se nota en que no
            - link "saludan a la bandera ni cantan el himno" [ref=f23e241] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-que-no-participan-ceremonias-nacionalistas-bandera/
            - text: y en que
            - link "no van a la guerra" [ref=f23e242] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/por-qu%C3%A9-no-van-a-la-guerra/
            - text: . Lo del servicio militar y sus alternativas depende de las leyes de cada país.
          - paragraph [ref=f23e243]:
            - strong [ref=f23e244]: "Fuentes:"
            - link "La Atalaya, 1-11-1999, «Preguntas de los lectores» ↗" [ref=f23e245] [cursor=pointer]:
              - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1999807
            - text: ·
            - link "FAQ oficial sobre neutralidad política ↗" [ref=f23e246] [cursor=pointer]:
              - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/neutralidad-pol%C3%ADtica/
            - text: .
