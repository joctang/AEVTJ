              - text: permite beber con moderación, pero considera pecado emborracharse. Su manual confidencial para ancianos distingue entre una borrachera aislada y en privado, en la que puede bastar con un consejo, y emborracharse a menudo o en público, que puede acabar en un comité. Tomarse una copa no tiene consecuencias.
            - heading "¿Pueden fumar o consumir tabaco?" [level=3] [ref=f23e255]
            - paragraph [ref=f23e256]:
              - text: No. La
              - link "organización" [ref=f23e257] [cursor=pointer]:
                - /url: https://www.jw.org/es/ense%C3%B1anzas-b%C3%ADblicas/preguntas/es-pecado-fumar/
              - text: reconoce que la Biblia no habla del tabaco, pero concluye que fumar es pecado porque va contra principios sobre la limpieza, la salud y el cuidado de los demás. Aplica lo mismo al tabaco de mascar, al rapé y a los cigarrillos electrónicos con nicotina.
          - complementary [ref=f23e258]:
            - strong [ref=f23e259]: Beber no es lo mismo que fumar
            - paragraph [ref=f23e260]: El alcohol está permitido con moderación. El tabaco, en cambio, no se permite de ninguna forma.
