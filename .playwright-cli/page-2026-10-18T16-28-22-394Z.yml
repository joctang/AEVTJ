      - region [ref=f11e107]:
        - generic [ref=f11e108]:
          - generic [ref=f11e110]: "1"
          - heading "¿Cómo visten en las reuniones y al predicar?" [level=2] [ref=f11e111]
        - paragraph [ref=f11e112]: Lo más habitual sigue siendo vestir de manera formal para las reuniones y la predicación. La ropa no es idéntica en todas partes y cada persona elige prendas distintas, pero la imagen reconocible suele ser la de hombres con traje y corbata y mujeres con falda o vestido. En 2023 y 2024 se anunciaron cambios concretos sobre la barba, los pantalones de vestir y el uso de chaqueta y corbata.
        - table [ref=f11e114]:
          - rowgroup [ref=f11e115]:
            - row [ref=f11e116]:
              - columnheader "Situación" [ref=f11e117]
              - columnheader "Qué suele verse o qué cambió" [ref=f11e118]
              - columnheader "Matices" [ref=f11e119]
          - rowgroup [ref=f11e120]:
            - row [ref=f11e121]:
              - rowheader "Reuniones" [ref=f11e122]
              - 'cell "Es habitual ver ropa formal: traje y corbata en muchos hombres, y falda o vestido en muchas mujeres." [ref=f11e123]'
              - cell "Las prendas y costumbres varían según el país, el clima y la actividad." [ref=f11e124]
            - row [ref=f11e125]:
              - rowheader "Barba" [ref=f11e126]
              - cell "Desde diciembre de 2023, llevarla es una decisión personal y no debería afectar a los nombramientos." [ref=f11e127]
              - cell "La aclaración respondió a preguntas sobre hermanos con responsabilidades; el artículo de 2025 muestra que a algunas personas aún les sorprendía ver barbas en discursos." [ref=f11e128]
            - row [ref=f11e129]:
              - rowheader "Pantalones de mujer" [ref=f11e130]
              - cell "El anuncio de marzo de 2024 los permite en el ministerio y al asistir a reuniones y asambleas." [ref=f11e131]
              - cell "Para intervenir en el programa, el anuncio conserva la referencia a falda o vestido cuando esa sea la costumbre local." [ref=f11e132]
            - row [ref=f11e133]:
              - rowheader "Chaqueta y corbata de hombre" [ref=f11e134]
              - cell "Desde marzo de 2024, pueden decidir si las llevan en el ministerio y al asistir a reuniones y asambleas." [ref=f11e135]
              - cell "Para intervenir en el programa, el anuncio mantiene chaqueta y corbata cuando esa sea la costumbre local." [ref=f11e136]
            - row [ref=f11e137]:
              - rowheader "Visita a Betel" [ref=f11e138]
              - cell "El anuncio de 2024 recomienda chaqueta y corbata para hombres y falda o vestido para mujeres cuando sea la costumbre local." [ref=f11e139]
              - cell "Es una orientación condicionada, no una descripción de la ropa cotidiana de los Testigos." [ref=f11e140]
      - region [ref=f11e141]:
        - generic [ref=f11e142]:
          - generic [ref=f11e144]: "2"
          - heading "¿Por qué visten de manera formal?" [level=2] [ref=f11e145]
        - paragraph [ref=f11e146]: Los Testigos de Jehová suelen ir bien arreglados a las reuniones y cuando predican. La organización explica que sus miembros eligen ropa limpia, modesta y apropiada para mostrar respeto a Dios y a quienes están presentes. Para muchos, vestir así también forma parte de representar a su congregación.
        - paragraph [ref=f11e147]: "No hay un uniforme mundial: la ropa cambia según el país, la cultura y la actividad. Aun así, ir arreglados a las reuniones y al predicar ha sido una costumbre reconocible durante mucho tiempo y sigue siendo habitual."
        - paragraph [ref=f11e148]: La ropa formal sigue siendo la imagen más reconocible en reuniones y predicación, aunque las prendas y su grado de formalidad cambien según el lugar.
      - region [ref=f11e149]:
        - generic [ref=f11e150]:
          - generic [ref=f11e151]:
            - generic [ref=f11e152]:
              - generic [ref=f11e154]: "3"
              - heading "¿Pueden llevar barba? El cambio en 2023" [level=2] [ref=f11e155]
            - paragraph [ref=f11e156]:
              - strong [ref=f11e157]: Sí.
              - text: En el Informe 8 del Cuerpo Gobernante, del 15 de diciembre de 2023
              - superscript [ref=f11e158]:
                - link "Fuente 1" [ref=f11e159] [cursor=pointer]:
                  - /url: "#fn-1"
                  - text: "1"
              - text: ", la organización explicó que la Biblia no condena la barba y pidió que no se juzgara a un hombre por decidir llevarla. El anuncio también está disponible en su transcripción en español"
              - superscript [ref=f11e160]:
                - link "Fuente 2" [ref=f11e161] [cursor=pointer]:
                  - /url: "#fn-2"
                  - text: "2"
              - text: .
            - paragraph [ref=f11e162]: El informe también aclara que un hermano con barba puede tener responsabilidades en la congregación y que no se le debe valorar por su aspecto. Esto muestra que la barba había influido en quién se consideraba adecuado para ciertas funciones, aunque no prueba que hubiera una prohibición escrita igual en todas las congregaciones.
            - paragraph [ref=f11e163]: La pregunta «¿por qué los Testigos de Jehová no usan barba?» ya no describe la postura actual. Desde 2023, la organización dice que cada hombre puede decidir si la lleva. Antes, ir afeitado era la expectativa habitual y podía influir en la aceptación de un hermano para ciertas responsabilidades. Hoy unos la llevan y otros prefieren afeitarse.
          - figure [ref=f11e164]:
            - img "Ilustración de una maquinilla, un peine y un cepillo de barba conectados por un hilo lima suelto." [ref=f11e165]
      - region [ref=f11e166]:
        - generic [ref=f11e167]:
          - generic [ref=f11e169]: "4"
          - heading "Qué aporta el artículo de 2025" [level=2] [ref=f11e170]
        - paragraph [ref=f11e171]:
          - text: En julio de 2025,
          - emphasis [ref=f11e172]: La Atalaya
          - text: publicó el relato de una Testigo de Eslovenia
          - superscript [ref=f11e173]:
            - link "Fuente 3" [ref=f11e174] [cursor=pointer]:
              - /url: "#fn-3"
              - text: "3"
          - text: "que dijo haberse sorprendido al ver por primera vez a un hermano barbudo dar un discurso, pese a conocer el anuncio de 2023. Contó que oró para adaptarse al cambio. Es un testimonio individual publicado por la propia organización: no mide cuántos miembros reaccionaron así, pero muestra que la antigua expectativa seguía teniendo fuerza para algunas personas. El artículo de 2025 no anuncia una nueva norma sobre barba o ropa; promueve aceptar los cambios de dirección de la organización."
        - paragraph [ref=f11e175]: "Queda una pregunta: si la barba no estaba prohibida por la Biblia, ¿por qué la expectativa anterior llegó a influir en quién parecía apropiado para representar a la congregación? En 2023, el informe explicó: las costumbres sociales cambian y la organización no quiere juzgar ni fomentar divisiones por ese asunto. Eso explica cómo justificó el cambio; no demuestra por sí solo todos los motivos por los que mantuvo antes la expectativa. Afirmar que buscaba retener miembros o mejorar su imagen sería una hipótesis, no un hecho probado por las fuentes consultadas."
      - region [ref=f11e176]:
        - generic [ref=f11e177]:
          - generic [ref=f11e178]:
            - generic [ref=f11e179]:
              - generic [ref=f11e181]: "5"
              - heading "¿Las mujeres tienen que llevar falda?" [level=2] [ref=f11e182]
            - paragraph [ref=f11e183]:
              - strong [ref=f11e184]: No para asistir a todas las actividades.
              - text: El Informe 2 del Cuerpo Gobernante, del 15 de marzo de 2024
              - superscript [ref=f11e185]:
                - link "Fuente 4" [ref=f11e186] [cursor=pointer]:
                  - /url: "#fn-4"
                  - text: "4"
              - text: anunció que las mujeres pueden llevar
              - strong [ref=f11e187]: pantalones de vestir
              - text: al participar en el ministerio y al asistir a reuniones y asambleas de circuito o regionales. Pidió que fueran prendas dignas, modestas y apropiadas, no informales.
            - paragraph [ref=f11e188]:
              - text: El mismo anuncio distingue entre asistir y participar en el programa. Si una mujer interviene en él, debe llevar falda o vestido
              - strong [ref=f11e189]: cuando esa sea la costumbre del lugar donde vive
              - text: . También puede elegir falda o vestido aunque no intervenga. La transcripción oficial
              - superscript [ref=f11e190]:
                - link "Fuente 5" [ref=f11e191] [cursor=pointer]:
                  - /url: "#fn-5"
                  - text: "5"
              - text: permite leer exactamente a qué situaciones se refiere.
            - paragraph [ref=f11e192]: "En resumen: desde 2024 pueden llevar pantalones de vestir a reuniones y al predicar. Si participan en el programa, se mantiene la falda o el vestido cuando esa sea la costumbre local. El anuncio no fija una longitud concreta para las faldas."
          - figure [ref=f11e193]:
            - img "Ilustración de unos pantalones de vestir y una falda colgados en perchas, unidos por un hilo lima." [ref=f11e194]
      - region [ref=f11e195]:
        - generic [ref=f11e196]:
          - generic [ref=f11e197]:
            - generic [ref=f11e198]:
              - generic [ref=f11e200]: "6"
              - heading "¿Los hombres necesitan traje y corbata?" [level=2] [ref=f11e201]
            - paragraph [ref=f11e202]:
              - strong [ref=f11e203]: No siempre.
              - text: Desde el anuncio de marzo de 2024, los hombres pueden decidir si llevan chaqueta o corbata en el ministerio y al asistir a reuniones y asambleas. Si no las llevan, la organización sigue pidiendo una apariencia apropiada, modesta y digna, no informal.
            - paragraph [ref=f11e204]:
              - text: Si participan en el programa, deben llevar chaqueta
              - strong [ref=f11e205]: "y"
              - text: corbata cuando esa sea la costumbre local. Pueden elegir esas prendas aunque no participen. El informe no dice que el traje sea obligatorio para todo asistente ni que haya dejado de importar cómo se viste quien representa a la congregación.
          - figure [ref=f11e206]:
            - img "Ilustración de una chaqueta y una corbata sobre una silla, junto a un hilo lima suelto." [ref=f11e207]
      - region [ref=f11e208]:
        - generic [ref=f11e209]:
          - generic [ref=f11e210]:
            - generic [ref=f11e211]:
              - generic [ref=f11e213]: "7"
              - heading "¿Qué cambia al participar en el programa o visitar Betel?" [level=2] [ref=f11e214]
            - paragraph [ref=f11e215]: El cambio distingue entre asistir a una reunión y participar en su programa. Para quienes intervienen, el anuncio mantiene falda o vestido para las mujeres y chaqueta y corbata para los hombres si esa es la costumbre local.
            - paragraph [ref=f11e216]: "Para las visitas a Betel, recomienda también esas prendas cuando sean habituales en el lugar: chaqueta y corbata para los hombres, y falda o vestido para las mujeres."
          - figure [ref=f11e217]:
            - img "Ilustración de una persona sentada entre varias sillas y otra ante un atril, conectadas por un hilo lima." [ref=f11e218]
      - region [ref=f11e219]:
        - generic [ref=f11e220]:
          - generic [ref=f11e221]:
            - generic [ref=f11e222]:
              - generic [ref=f11e224]: "8"
              - heading "¿Y en la vida diaria o en otros países?" [level=2] [ref=f11e225]
            - paragraph [ref=f11e226]: Los cambios anunciados se refieren a reuniones, asambleas, predicación y visitas a Betel. No establecen cómo vestir en el trabajo, en casa o durante el tiempo libre. En esos ámbitos, cada persona decide según la ocasión y las costumbres de su entorno.
            - paragraph [ref=f11e227]: "La propia organización deja algunas decisiones en manos de la costumbre local. Y las experiencias personales pueden ser distintas: algunas personas recuerdan comentarios o presión para cambiarse; otras, no. Para saber cómo lo vivió alguien en concreto, hacen falta testimonios directos."
          - figure [ref=f11e228]:
            - img "Ilustración de una persona en una sala de reunión y otra en un espacio cotidiano, unidas por un hilo lima." [ref=f11e229]
