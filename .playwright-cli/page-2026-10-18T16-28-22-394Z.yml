          - generic [ref=f11e274]:
            - paragraph [ref=f11e275]: La ropa permite reconocer una costumbre, pero no nos dice cómo se siente cada persona al seguirla. Hay quienes la viven con naturalidad y quienes recuerdan presión o comentarios. Para contar esas experiencias hacen falta testimonios concretos, sin atribuir a todos una misma vivencia.
