      - region [ref=e117]:
        - generic [ref=e118]:
          - generic [ref=e120]: "1"
          - 'heading "La respuesta breve: ¿cómo deben vestir?" [level=2] [ref=e121]'
        - paragraph [ref=e122]:
          - text: Hay que distinguir entre
          - strong [ref=e123]: lo que la organización comunica
          - text: ","
          - strong [ref=e124]: las costumbres de cada congregación
          - text: "y"
          - strong [ref=e125]: lo que vive cada persona
          - text: . Históricamente, las observaciones disponibles muestran una expectativa de vestir formal en reuniones y predicación. Las pautas oficiales se flexibilizaron en 2023 y 2024, pero no hay una encuesta representativa que permita medir cómo se aplican hoy en cada país.
        - table [ref=e127]:
          - rowgroup [ref=e128]:
            - row [ref=e129]:
              - columnheader "Situación" [ref=e130]
              - columnheader "Orientación institucional publicada" [ref=e131]
              - columnheader "Qué permite afirmar sobre la práctica" [ref=e132]
          - rowgroup [ref=e133]:
            - row [ref=e134]:
              - rowheader "Reuniones" [ref=e135]
              - cell "La organización pide ropa limpia, modesta y apropiada, y dice que hay margen para elegir." [ref=e136]
              - cell "Observadores independientes describieron durante años una presentación formal. Eso no prueba que se vistiera igual en todas partes." [ref=e137]
            - row [ref=e138]:
              - rowheader "Barba" [ref=e139]
              - cell "Desde diciembre de 2023, llevarla es una decisión personal y no debería afectar a los nombramientos." [ref=e140]
              - cell "La aclaración respondió a preguntas sobre hermanos con responsabilidades; el artículo de 2025 muestra que a algunas personas aún les sorprendía ver barbas en discursos." [ref=e141]
            - row [ref=e142]:
              - rowheader "Pantalones de mujer" [ref=e143]
              - cell "El anuncio de marzo de 2024 los permite en el ministerio y al asistir a reuniones y asambleas." [ref=e144]
              - cell "Para intervenir en el programa, el anuncio conserva la referencia a falda o vestido cuando esa sea la costumbre local." [ref=e145]
            - row [ref=e146]:
              - rowheader "Chaqueta y corbata de hombre" [ref=e147]
              - cell "Desde marzo de 2024, pueden decidir si las llevan en el ministerio y al asistir a reuniones y asambleas." [ref=e148]
              - cell "Para intervenir en el programa, el anuncio mantiene chaqueta y corbata cuando esa sea la costumbre local." [ref=e149]
            - row [ref=e150]:
              - rowheader "Visita a Betel" [ref=e151]
              - cell "El anuncio de 2024 recomienda chaqueta y corbata para hombres y falda o vestido para mujeres cuando sea la costumbre local." [ref=e152]
              - cell "Es una orientación condicionada, no una descripción de la ropa cotidiana de los Testigos." [ref=e153]
      - region [ref=e154]:
        - generic [ref=e155]:
          - generic [ref=e157]: "2"
          - heading "¿Por qué van arreglados a las reuniones?" [level=2] [ref=e158]
        - paragraph [ref=e159]:
          - text: La explicación institucional
          - superscript [ref=e160]:
            - link "Fuente 1" [ref=e161] [cursor=pointer]:
              - /url: "#fn-1"
              - text: "1"
          - text: vincula la ropa de reunión con el respeto a Dios y a quienes asisten, e invoca principios bíblicos de modestia y buen juicio. Esa es la justificación que ofrece la organización; por sí sola no explica cómo se convertían esos principios en expectativas concretas dentro de cada congregación.
        - paragraph [ref=e162]:
          - text: La misma publicación afirma que
          - strong [ref=e163]: hay espacio para la elección personal
          - text: y que no hace falta ropa costosa. Sin embargo, los estudios y observaciones independientes que hemos localizado describen una imagen mucho más concreta y formal en reuniones y predicación. La distancia entre un principio general y la expectativa social de cómo debía vestir quien representaba a la congregación merece explicarse, sin asumir que cada persona lo vivió igual.
        - paragraph [ref=e164]: La organización lo presenta como una elección guiada por principios. En la práctica, la ropa formal también funcionó como una expectativa social reconocible en actividades religiosas; las fuentes no permiten medir cuán uniforme fue.
      - region [ref=e165]:
        - generic [ref=e166]:
          - generic [ref=e168]: "3"
          - heading "Qué muestran las observaciones independientes" [level=2] [ref=e169]
        - paragraph [ref=e170]:
          - text: Un estudio sociológico de Andrew Holden describe a hombres con traje o camisa formal y corbata, y a mujeres con falda o vestido, tanto en reuniones como en la predicación. Una observación académica de una reunión en Colchester, Inglaterra, en 2015, también registró una apariencia muy arreglada. Un reportaje de
          - emphasis [ref=e171]: The Guardian
          - text: "describió de forma similar a Testigos predicando en Londres. Son observaciones situadas —no una encuesta mundial—, pero corroboran que la formalidad no era solo una formulación en publicaciones: se veía en la práctica."
        - paragraph [ref=e172]: La evidencia disponible también obliga a poner límites. Esas fuentes son anteriores a los cambios anunciados en 2023 y 2024, se concentran en lugares concretos y no representan todas las experiencias. Los relatos de miembros y exmiembros pueden documentar cómo se sintió la presión o qué consecuencias tuvo en una congregación, pero deben identificarse como testimonios personales y no generalizarse a todos los Testigos.
      - region [ref=e173]:
        - generic [ref=e174]:
          - generic [ref=e175]:
            - generic [ref=e176]:
              - generic [ref=e178]: "4"
              - heading "¿Pueden llevar barba? Qué cambió en 2023" [level=2] [ref=e179]
            - paragraph [ref=e180]:
              - strong [ref=e181]: Sí.
              - text: En el Informe 8 del Cuerpo Gobernante, del 15 de diciembre de 2023
              - superscript [ref=e182]:
                - link "Fuente 2" [ref=e183] [cursor=pointer]:
                  - /url: "#fn-2"
                  - text: "2"
              - text: ", la organización explicó que la Biblia no condena la barba y pidió que no se juzgara a un hombre por decidir llevarla. El anuncio puede consultarse también en su transcripción en español"
              - superscript [ref=e184]:
                - link "Fuente 3" [ref=e185] [cursor=pointer]:
                  - /url: "#fn-3"
                  - text: "3"
              - text: .
            - paragraph [ref=e186]: El informe afirma que la Biblia no condena la barba y que, por tanto, llevarla es una decisión personal. También aborda expresamente si un hermano con barba puede ocupar responsabilidades y dice que sus aptitudes deben juzgarse por su espiritualidad, no por el vello facial. Esto permite concluir que la apariencia había tenido peso organizativo en ese ámbito; no demuestra que existiera una prohibición escrita idéntica o aplicada con la misma intensidad en todas las congregaciones.
            - paragraph [ref=e187]: Por eso, «¿por qué los Testigos de Jehová no usan barba?» parte hoy de una premisa desactualizada. La respuesta más completa es que durante años la expectativa de ir afeitado pudo influir en la aceptación social y en el acceso a ciertas responsabilidades, aunque la Biblia no prohíba la barba; desde 2023, la organización afirma que es una decisión personal. Una persona puede llevarla y otra preferir afeitarse.
          - figure [ref=e188]:
            - img "Ilustración de una maquinilla, un peine y un cepillo de barba conectados por un hilo lima suelto." [ref=e189]
      - region [ref=e190]:
        - generic [ref=e191]:
          - generic [ref=e193]: "5"
          - heading "Qué aporta el artículo de 2025" [level=2] [ref=e194]
        - paragraph [ref=e195]:
          - text: En julio de 2025,
          - emphasis [ref=e196]: La Atalaya
          - text: "publicó el relato de una Testigo de Eslovenia que dijo haberse sorprendido al ver por primera vez a un hermano barbudo dar un discurso, pese a conocer el anuncio de 2023. Contó que oró para adaptarse al cambio. Es un testimonio individual publicado por la propia organización: no mide cuántos miembros reaccionaron así, pero muestra que la antigua expectativa seguía teniendo fuerza para algunas personas. El artículo de 2025 no anuncia una nueva norma sobre barba o ropa; promueve aceptar los cambios de dirección de la organización."
        - paragraph [ref=e197]: "La comparación deja una pregunta legítima: si la barba no estaba prohibida por la Biblia, ¿por qué la expectativa anterior llegó a influir en quién parecía apropiado para representar a la congregación? El informe de 2023 ofrece una explicación institucional: las costumbres sociales cambian y la organización no quiere juzgar ni fomentar divisiones por ese asunto. Eso explica cómo justificó el cambio; no demuestra por sí solo todos los motivos por los que mantuvo antes la expectativa. Afirmar que buscaba retener miembros o mejorar su imagen sería una hipótesis, no un hecho probado por las fuentes consultadas."
      - region [ref=e198]:
        - generic [ref=e199]:
          - generic [ref=e200]:
            - generic [ref=e201]:
              - generic [ref=e203]: "6"
              - heading "¿Las mujeres tienen que llevar falda?" [level=2] [ref=e204]
            - paragraph [ref=e205]:
              - strong [ref=e206]: No para asistir a todas las actividades.
              - text: El Informe 2 del Cuerpo Gobernante, del 15 de marzo de 2024
              - superscript [ref=e207]:
                - link "Fuente 4" [ref=e208] [cursor=pointer]:
                  - /url: "#fn-4"
                  - text: "4"
              - text: anunció que las mujeres pueden llevar
              - strong [ref=e209]: pantalones de vestir
              - text: al participar en el ministerio y al asistir a reuniones y asambleas de circuito o regionales. Pidió que fueran prendas dignas, modestas y apropiadas, no informales.
            - paragraph [ref=e210]:
              - text: El mismo anuncio distingue entre asistir y participar en el programa. Si una mujer interviene en él, debe llevar falda o vestido
              - strong [ref=e211]: cuando esa sea la costumbre del lugar donde vive
              - text: . También puede elegir falda o vestido aunque no intervenga. La transcripción oficial
              - superscript [ref=e212]:
                - link "Fuente 5" [ref=e213] [cursor=pointer]:
                  - /url: "#fn-5"
                  - text: "5"
              - text: permite leer exactamente a qué situaciones se refiere.
            - paragraph [ref=e214]: Así, ni «siempre tienen que llevar falda» ni «ahora cualquier prenda vale para cualquier función» resume bien la orientación de 2024. El comunicado tampoco establece una longitud universal para las faldas.
          - figure [ref=e215]:
            - img "Ilustración de unos pantalones de vestir y una falda colgados en perchas, unidos por un hilo lima." [ref=e216]
      - region [ref=e217]:
        - generic [ref=e218]:
          - generic [ref=e219]:
            - generic [ref=e220]:
              - generic [ref=e222]: "7"
              - heading "¿Los hombres necesitan traje y corbata?" [level=2] [ref=e223]
            - paragraph [ref=e224]:
              - strong [ref=e225]: No siempre.
              - text: Desde el anuncio de marzo de 2024, los hombres pueden decidir si llevan chaqueta o corbata en el ministerio y al asistir a reuniones y asambleas. Si no las llevan, la organización sigue pidiendo una apariencia apropiada, modesta y digna, no informal.
            - paragraph [ref=e226]:
              - text: Si participan en el programa, deben llevar chaqueta
              - strong [ref=e227]: "y"
              - text: corbata cuando esa sea la costumbre local. Pueden elegir esas prendas aunque no participen. El informe no dice que el traje sea obligatorio para todo asistente ni que haya dejado de importar cómo se viste quien representa a la congregación.
          - figure [ref=e228]:
            - img "Ilustración de una chaqueta y una corbata sobre una silla, junto a un hilo lima suelto." [ref=e229]
      - region [ref=e230]:
        - generic [ref=e231]:
          - generic [ref=e232]:
            - generic [ref=e233]:
              - generic [ref=e235]: "8"
              - heading "¿Qué cambia al participar en el programa o visitar Betel?" [level=2] [ref=e236]
            - paragraph [ref=e237]:
              - text: El anuncio de 2024 traza una diferencia concreta entre
              - strong [ref=e238]: asistir
              - text: "y"
              - strong [ref=e239]: tomar parte en el programa
              - text: de reuniones y asambleas. Para esta última función, menciona falda o vestido en mujeres y chaqueta y corbata en hombres cuando sea la costumbre del lugar.
            - paragraph [ref=e240]: "También añade una orientación para las visitas a Betel: en los lugares donde sea la costumbre, considera apropiado que los hombres lleven chaqueta y corbata, y las mujeres falda o vestido. Estas condiciones aparecen en el anuncio completo y no deben perderse al resumir los cambios de 2024."
          - figure [ref=e241]:
            - img "Ilustración de una persona sentada entre varias sillas y otra ante un atril, conectadas por un hilo lima." [ref=e242]
      - region [ref=e243]:
        - generic [ref=e244]:
          - generic [ref=e245]:
            - generic [ref=e246]:
              - generic [ref=e248]: "9"
              - heading "¿Y en la vida diaria o en otros países?" [level=2] [ref=e249]
            - paragraph [ref=e250]:
              - text: Los anuncios oficiales hablan de reuniones, asambleas, ministerio y visitas a Betel.
              - strong [ref=e251]: No fijan un código universal para el trabajo, la casa o el tiempo libre.
              - text: Las investigaciones y observaciones describen situaciones concretas, no cómo viste cada Testigo en todos los ámbitos.
            - paragraph [ref=e252]: La organización menciona la costumbre local para determinadas funciones. Eso confirma que el contexto importa. Los testimonios de miembros y exmiembros pueden ayudar a entender la experiencia —por ejemplo, sentirse observado, recibir comentarios o tener que cambiarse para una actividad—, pero cada relato debe atribuirse a quien lo vivió. No contamos aquí con datos representativos para comparar países o medir la práctica actual.
          - figure [ref=e253]:
            - img "Ilustración de una persona en una sala de reunión y otra en un espacio cotidiano, unidas por un hilo lima." [ref=e254]
      - region [ref=e255]:
        - generic [ref=e256]:
          - paragraph [ref=e257]: Dudas habituales
          - heading "Preguntas frecuentes" [level=2] [ref=e258]
          - generic [ref=e259]:
