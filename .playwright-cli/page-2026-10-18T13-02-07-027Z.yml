      - region [ref=e288]:
        - group [ref=e289]:
          - generic "Fuentes y documentación 5 referencias · Revisado el 15 de octubre de 2026" [ref=e290] [cursor=pointer]:
            - generic [ref=e291]:
              - heading "Fuentes y documentación" [level=2] [ref=e292]
              - generic [ref=e293]: 5 referencias · Revisado el 15 de octubre de 2026
      - region [ref=e295]:
        - generic [ref=e296]:
          - paragraph [ref=e297]: La mirada de la AEVTJ
          - heading "Mirar a la persona, no solo a su ropa" [level=2] [ref=e298]
          - generic [ref=e299]:
            - paragraph [ref=e300]: La apariencia puede hacer visible una costumbre religiosa, pero no cuenta la experiencia completa de quien la lleva. Algunas personas viven esas decisiones con naturalidad; otras pueden tener recuerdos distintos. Para hablar de experiencias concretas necesitamos testimonios identificables, no suponerlas a partir de la ropa.
            - paragraph [ref=e301]:
