            - strong [ref=e197]: conflicto interno
            - text: ": por un lado, te sientes aliviado al pensar en liberarte de normas y rutinas que ya no compartes; por otro,"
            - strong [ref=e198]: te aterra perder los lazos
            - text: con amigos y familiares que siguen dentro.
          - paragraph [ref=e199]: "En esta organización, la práctica habitual cuando alguien se aleja o es expulsado conlleva el ostracismo: los miembros tienen prohibido dirigirte la palabra o mantener contacto cercano contigo. Para una persona que ha invertido años de su vida ahí, esto puede ser devastador y desencadenar sentimientos de ansiedad, soledad, vergüenza o culpa."
          - paragraph [ref=e200]:
            - text: Algunos testigos que deciden irse y tienen familiares muy apegados a la congregación se enfrentan al miedo de ser rechazados o incluso de que sus seres queridos los corten de su vida por completo. Este escenario puede provocar
            - strong [ref=e201]: episodios depresivos
            - text: y, en los casos más graves, llevar a
            - strong [ref=e202]: pensamientos suicidas
            - text: ". No es un asunto menor: la salud mental está en juego, por lo que es fundamental que busques o cuentes con redes de apoyo."
