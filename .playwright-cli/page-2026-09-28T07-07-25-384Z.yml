          - generic [ref=e128]: "1"
          - heading "El comienzo" [level=2] [ref=e129]
          - paragraph [ref=e130]: Tal vez has llegado a este texto porque comienzas a preguntarte si las enseñanzas y las prácticas de los Testigos de Jehová son realmente lo que necesitas o deseas en tu vida. A lo mejor llevas tiempo sintiendo que algo no encaja, o que tus dudas cada día crecen un poco más. O simplemente has notado que tu visión del mundo ha cambiado y ya no se alinea con la de la organización. Sean cuales sean tus motivos, entender lo que implica dejar este grupo y cómo encontrar ayuda puede marcar la diferencia en tu experiencia.
        - generic [ref=e132]:
          - img "Ilustración de dos personas conversando con una Biblia abierta sobre la mesa" [ref=e134]
          - text: +
      - generic [ref=e136]:
        - generic [ref=e137]:
          - generic [ref=e139]: "2"
          - heading "Love bombing" [level=2] [ref=e140]
          - paragraph [ref=e141]: El inicio casi siempre se presenta como un “estudio bíblico”, una actividad que promete enseñarte las verdades de la Biblia. Sin embargo, en muchos casos, se centra en estudiar publicaciones de la Watchtower, más que en realizar un análisis profundo e imparcial de las Escrituras. Te invitan a reuniones, te rodean de gestos amables y de sonrisas que generan una sensación muy cálida de pertenencia. A este fenómeno suele llamársele “love bombing” o “bombardeo de amor”, y funciona tan bien que, al poco tiempo, sientes que has encontrado a una nueva familia y a verdaderos amigos.
        - generic [ref=e143]:
          - 'img "Ilustración sobre el love bombing: gestos de afecto y bienvenida de un grupo" [ref=e145]'
          - text: +
      - blockquote [ref=e147]: «al poco tiempo, sientes que has encontrado a una nueva familia y a verdaderos amigos»
      - generic [ref=e149]:
        - generic [ref=e150]:
          - generic [ref=e152]: "3"
          - 'heading "La vida dentro: la sensación de “familia espiritual”" [level=2] [ref=e153]'
          - paragraph [ref=e154]: Mientras vives como Testigo de Jehová, tu forma de ver el mundo y de expresarte puede transformarse. No siempre se trata de un cambio brusco, sino de una serie de pequeños ajustes en tu forma de pensar y actuar. La organización utiliza diversas técnicas de influencia psicológica que refuerzan la confianza en su doctrina y potencian el sentimiento de grupo exclusivo y privilegiado.
          - paragraph [ref=e155]: A lo largo de tu permanencia, estableces lazos intensos con otros miembros. Estas amistades se vuelven cruciales porque son, en muchos casos, el único círculo social con el que te relacionas profundamente. Para quienes nacieron y crecieron en la organización, esto se acentúa aún más, pues no han conocido otra comunidad más allá de la congregación.
        - generic [ref=e157]:
          - img "Ilustración de la predicación puerta a puerta con publicaciones de la organización" [ref=e159]
          - text: +
      - generic [ref=e161]:
        - generic [ref=e162]:
          - generic [ref=e164]: "4"
          - heading "El bautismo" [level=2] [ref=e165]
          - paragraph [ref=e166]: Conforme avanza el tiempo, adoptas poco a poco sus normas de conducta y aprendes que ciertas actividades sociales o incluso amistades fuera del grupo se consideran inapropiadas. Cuando ya estás totalmente inmerso en esas enseñanzas y crees firmemente que has encontrado la “verdad”, te plantean la dedicación y el bautismo como un paso de fe, un honor para servir a Dios. Lo que no se menciona abiertamente es que, una vez bautizado, tu vida y tus relaciones cambiarán de forma irreversible. Si en algún momento decides marcharte, la salida será mucho más complicada que la entrada.
        - generic [ref=e168]:
          - img "Ilustración de un bautismo" [ref=e170]
          - text: +
      - generic [ref=e172]:
        - generic [ref=e173]:
