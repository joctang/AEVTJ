          - 'heading "Empezar a cuestionar: cuando surgen las dudas" [level=2] [ref=e176]'
          - paragraph [ref=e177]:
            - text: "Los primeros indicios de que algo no encaja pueden llegar en el momento más inesperado: tal vez escuchas un discurso con el que no concuerdas, lees"
            - strong [ref=e178]: declaraciones contradictorias en las publicaciones oficiales
            - text: o descubres casos de abuso y encubrimientos que sacuden tus convicciones.
          - paragraph [ref=e179]:
            - text: También puede ser que veas cómo, con frecuencia,
            - strong [ref=e180]: las normas se ajustan o cambian según las necesidades de la dirigencia
            - text: ", o cómo piden donaciones para grandes proyectos a largo plazo mientras predican que el “fin del mundo” está muy cerca."
          - paragraph [ref=e181]:
            - text: En algunos países, han salido a la luz denuncias legales y declaraciones bajo juramento que no coinciden con la imagen impecable que la organización desea proyectar. Todo ello crea
            - strong [ref=e182]: un choque entre lo que siempre has escuchado en los discursos y la realidad que comienzas a observar
            - text: .
          - paragraph [ref=e183]: Esto puede despertar en ti preguntas profundas sobre la coherencia de la doctrina y sobre si de verdad estás en “la única organización que Dios aprueba”.
        - generic [ref=e185]:
