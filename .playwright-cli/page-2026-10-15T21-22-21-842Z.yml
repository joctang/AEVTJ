            - group [ref=f4e219]:
              - heading "¿Se exige ropa cara o un uniforme?" [level=3] [ref=f4e221] [cursor=pointer]
            - group [ref=f4e223]:
              - heading "¿Las orientaciones de 2024 se aplican a toda la ropa diaria?" [level=3] [ref=f4e225] [cursor=pointer]
      - region [ref=f4e227]:
        - generic [ref=f4e228]:
          - paragraph [ref=f4e229]: La mirada de la AEVTJ
          - heading "Mirar a la persona, no solo a su ropa" [level=2] [ref=f4e230]
          - generic [ref=f4e231]:
            - paragraph [ref=f4e232]: La apariencia puede hacer visible una costumbre religiosa, pero no cuenta la experiencia completa de quien la lleva. Algunas personas viven esas decisiones con naturalidad; otras pueden tener recuerdos distintos. Para hablar de experiencias concretas necesitamos testimonios identificables, no suponerlas a partir de la ropa.
            - paragraph [ref=f4e233]:
              - text: En la AEVTJ queremos ofrecer información precisa para quien intenta entender las enseñanzas de los Testigos de Jehová o revisar su propia historia. Si necesitas hablar de lo que viviste, puedes
              - link "contactar con la asociación" [ref=f4e234] [cursor=pointer]:
                - /url: /contacto/
              - text: .
          - paragraph [ref=f4e235]: Sigue leyendo
