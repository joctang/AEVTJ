      - region [ref=f4e105]:
        - generic [ref=f4e106]:
          - generic [ref=f4e108]: "1"
          - 'heading "La respuesta breve: ¿cómo deben vestir?" [level=2] [ref=f4e109]'
        - paragraph [ref=f4e110]:
          - text: Depende de
          - strong [ref=f4e111]: la actividad
          - text: ", de"
          - strong [ref=f4e112]: si la persona interviene en el programa
          - text: y, en algunos casos, de
          - strong [ref=f4e113]: la costumbre del lugar
          - text: . Esta es la orientación que la organización comunica hoy para el ministerio, las reuniones y las asambleas; no es una descripción de cómo viste cada persona en su trabajo o en casa.
        - table [ref=f4e115]:
          - rowgroup [ref=f4e116]:
            - row [ref=f4e117]:
              - columnheader "Situación" [ref=f4e118]
              - columnheader "Orientación publicada" [ref=f4e119]
              - columnheader "Matiz importante" [ref=f4e120]
          - rowgroup [ref=f4e121]:
            - row [ref=f4e122]:
              - rowheader "Reuniones" [ref=f4e123]
              - cell "Ropa limpia, modesta y apropiada." [ref=f4e124]
              - cell "La explicación oficial deja espacio para elegir y dice que no hace falta ropa cara." [ref=f4e125]
            - row [ref=f4e126]:
              - rowheader "Barba" [ref=f4e127]
              - cell "Un hombre puede llevarla." [ref=f4e128]
              - cell "El informe de 2023 pide no juzgar a quien la lleve." [ref=f4e129]
            - row [ref=f4e130]:
              - rowheader "Pantalones de mujer" [ref=f4e131]
              - cell "Pantalones de vestir en el ministerio y al asistir a reuniones y asambleas." [ref=f4e132]
              - cell "Al participar en el programa, falda o vestido si esa es la costumbre local." [ref=f4e133]
            - row [ref=f4e134]:
              - rowheader "Chaqueta y corbata de hombre" [ref=f4e135]
              - cell "Puede decidir si las lleva en el ministerio y al asistir a reuniones y asambleas." [ref=f4e136]
              - cell "Al participar en el programa, ambas prendas si esa es la costumbre local." [ref=f4e137]
            - row [ref=f4e138]:
              - rowheader "Visita a Betel" [ref=f4e139]
              - cell "El anuncio de 2024 contempla chaqueta y corbata para hombres y falda o vestido para mujeres." [ref=f4e140]
              - cell "Lo condiciona a que sea la costumbre del lugar donde viven." [ref=f4e141]
      - region [ref=f4e142]:
        - generic [ref=f4e143]:
          - generic [ref=f4e145]: "2"
          - heading "¿Por qué van arreglados a las reuniones?" [level=2] [ref=f4e146]
        - paragraph [ref=f4e147]:
          - text: La
          - link "explicación de los Testigos de Jehová" [ref=f4e148] [cursor=pointer]:
            - /url: https://www.jw.org/es/biblioteca/folletos/voluntad-de-Jehov%C3%A1/indumentaria-y-arreglo-personal/
          - text: parte del respeto a Dios, a las personas que asisten y al lugar donde se reúnen. También invoca los principios bíblicos de modestia y buen juicio. Según esa explicación, la ropa no debería llamar la atención por ser excesivamente lujosa, reveladora o descuidada.
        - paragraph [ref=f4e149]:
          - text: La misma publicación afirma que
          - strong [ref=f4e150]: hay espacio para la elección personal
          - text: dentro de esos principios y que no hace falta vestir con ropa costosa para acudir a un Salón del Reino. Son criterios de su propia organización, no una lista exhaustiva de prendas autorizadas o prohibidas.
        - paragraph [ref=f4e151]: Ir arreglado es una expectativa para sus actividades religiosas. No convierte la ropa de todos los Testigos, en todos los momentos, en un uniforme.
      - region [ref=f4e152]:
        - generic [ref=f4e153]:
          - generic [ref=f4e155]: "3"
          - heading "¿Pueden llevar barba? Qué cambió en 2023" [level=2] [ref=f4e156]
        - paragraph [ref=f4e157]:
          - strong [ref=f4e158]: Sí.
          - text: En el
          - link "Informe 8 del Cuerpo Gobernante, del 15 de diciembre de 2023" [ref=f4e159] [cursor=pointer]:
            - /url: https://www.jw.org/es/noticias/region/internacionales/2023-Informe-8-del-Cuerpo-Gobernante/
          - text: ", la organización explicó que la Biblia no condena la barba y pidió que no se juzgara a un hombre por decidir llevarla. El anuncio puede consultarse también en su"
          - link "transcripción en español" [ref=f4e160] [cursor=pointer]:
            - /url: https://cfp2.jw-cdn.org/a/c36773/1/o/702023024_S_cnt_1.vtt
          - text: .
        - paragraph [ref=f4e161]: El informe repasa imágenes y costumbres de distintas épocas para explicar por qué durante años fue habitual ver a sus representantes afeitados. Esa explicación histórica procede de la propia organización. No permite afirmar que hubiera una regla idéntica, aplicada de igual modo, en todos los países y congregaciones.
        - paragraph [ref=f4e162]: Por eso, la pregunta «¿por qué los Testigos de Jehová no usan barba?» parte hoy de una premisa desactualizada. Una persona puede llevarla; otra puede preferir afeitarse. La orientación publicada sigue hablando de arreglo personal, pero ya no presenta la ausencia de barba como requisito general.
      - region [ref=f4e163]:
        - generic [ref=f4e164]:
          - generic [ref=f4e166]: "4"
          - heading "¿Las mujeres tienen que llevar falda?" [level=2] [ref=f4e167]
        - paragraph [ref=f4e168]:
          - strong [ref=f4e169]: No para asistir a todas las actividades.
          - text: El
          - link "Informe 2 del Cuerpo Gobernante, del 15 de marzo de 2024" [ref=f4e170] [cursor=pointer]:
            - /url: https://www.jw.org/es/noticias/region/internacionales/2024-Informe-2-del-Cuerpo-Gobernante/
          - text: anunció que las mujeres pueden llevar
          - strong [ref=f4e171]: pantalones de vestir
          - text: al participar en el ministerio y al asistir a reuniones y asambleas de circuito o regionales. Pidió que fueran prendas dignas, modestas y apropiadas, no informales.
        - paragraph [ref=f4e172]:
          - text: El mismo anuncio distingue entre asistir y participar en el programa. Si una mujer interviene en él, debe llevar falda o vestido
          - strong [ref=f4e173]: cuando esa sea la costumbre del lugar donde vive
          - text: . También puede elegir falda o vestido aunque no intervenga. La
          - link "transcripción oficial" [ref=f4e174] [cursor=pointer]:
            - /url: https://cfp2.jw-cdn.org/a/abd9084/2/o/1112024005_S_cnt_1.vtt
          - text: permite leer exactamente a qué situaciones se refiere.
        - paragraph [ref=f4e175]: Así, ni «siempre tienen que llevar falda» ni «ahora cualquier prenda vale para cualquier función» resume bien la orientación de 2024. El comunicado tampoco establece una longitud universal para las faldas.
      - region [ref=f4e176]:
        - generic [ref=f4e177]:
          - generic [ref=f4e179]: "5"
          - heading "¿Los hombres necesitan traje y corbata?" [level=2] [ref=f4e180]
        - paragraph [ref=f4e181]:
          - strong [ref=f4e182]: No siempre.
          - text: Desde el anuncio de marzo de 2024, los hombres pueden decidir si llevan chaqueta o corbata en el ministerio y al asistir a reuniones y asambleas. Si no las llevan, la organización sigue pidiendo una apariencia apropiada, modesta y digna, no informal.
        - paragraph [ref=f4e183]:
          - text: Si participan en el programa, deben llevar chaqueta
          - strong [ref=f4e184]: "y"
          - text: corbata cuando esa sea la costumbre local. Pueden elegir esas prendas aunque no participen. El informe no dice que el traje sea obligatorio para todo asistente ni que haya dejado de importar cómo se viste quien representa a la congregación.
      - region [ref=f4e185]:
        - generic [ref=f4e186]:
          - generic [ref=f4e188]: "6"
          - heading "¿Qué cambia al participar en el programa o visitar Betel?" [level=2] [ref=f4e189]
        - paragraph [ref=f4e190]:
          - text: El anuncio de 2024 traza una diferencia concreta entre
          - strong [ref=f4e191]: asistir
          - text: "y"
          - strong [ref=f4e192]: tomar parte en el programa
          - text: de reuniones y asambleas. Para esta última función, menciona falda o vestido en mujeres y chaqueta y corbata en hombres cuando sea la costumbre del lugar.
        - paragraph [ref=f4e193]: "También añade una orientación para las visitas a Betel: en los lugares donde sea la costumbre, considera apropiado que los hombres lleven chaqueta y corbata, y las mujeres falda o vestido. Estas condiciones aparecen en el anuncio completo y no deben perderse al resumir los cambios de 2024."
      - region [ref=f4e194]:
        - generic [ref=f4e195]:
          - generic [ref=f4e197]: "7"
          - heading "¿Y en la vida diaria o en otros países?" [level=2] [ref=f4e198]
        - paragraph [ref=f4e199]:
          - text: Las fuentes citadas hablan de reuniones, asambleas, ministerio y visitas a Betel.
          - strong [ref=f4e200]: No fijan un código universal para la ropa del trabajo, de casa o del tiempo libre.
          - text: Por eso, ver a una persona Testigo en una reunión no permite deducir cómo se viste en todos los demás ámbitos.
        - paragraph [ref=f4e201]: La organización menciona la costumbre local para determinadas funciones. Eso permite afirmar que el contexto importa, pero no describir una práctica idéntica para cada país o congregación sin datos adicionales. Del mismo modo, las publicaciones oficiales informan de la orientación comunicada; no prueban por sí solas cómo se vivió antes o después en cada familia.
      - region [ref=f4e202]:
        - generic [ref=f4e203]:
          - paragraph [ref=f4e204]: Dudas habituales
          - heading "Preguntas frecuentes" [level=2] [ref=f4e205]
          - generic [ref=f4e206]:
