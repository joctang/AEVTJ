              - strong [ref=f4e257]: Informe 8 del Cuerpo Gobernante de 2023
            - text: "y"
            - link "transcripción oficial" [ref=f4e258] [cursor=pointer]:
              - /url: https://cfp2.jw-cdn.org/a/c36773/1/o/702023024_S_cnt_1.vtt
            - text: . Anuncio sobre la barba del 15 de diciembre de 2023.
          - listitem [ref=f4e259]:
            - link [ref=f4e260] [cursor=pointer]:
              - /url: https://www.jw.org/es/noticias/region/internacionales/2024-Informe-2-del-Cuerpo-Gobernante/
              - strong [ref=f4e261]: Informe 2 del Cuerpo Gobernante de 2024
            - text: "y"
            - link "transcripción oficial" [ref=f4e262] [cursor=pointer]:
              - /url: https://cfp2.jw-cdn.org/a/abd9084/2/o/1112024005_S_cnt_1.vtt
            - text: . Anuncio sobre indumentaria del 15 de marzo de 2024, incluido el detalle sobre quienes participan en el programa y quienes visitan Betel.
        - paragraph [ref=f4e263]:
          - text: Estas fuentes muestran la
          - strong [ref=f4e264]: posición institucional publicada
          - text: . No establecen que toda congregación o toda persona la haya aplicado de la misma manera. No se incluyen aquí experiencias individuales no verificadas ni una historia completa de las prácticas anteriores.
        - paragraph [ref=f4e265]: Revisado el 15 de octubre de 2026. Los enlaces externos se abren en una pestaña nueva.
