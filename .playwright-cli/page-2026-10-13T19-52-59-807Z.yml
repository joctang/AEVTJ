          - text: ", un medio evangélico. Los ejemplos familiares de Holden están en la página 5 de su estudio, y lo que dice sobre los casos dudosos, en la página 9. Sobre Trish Karr nos basamos en la presentación de ABC Radio National."
        - paragraph [ref=f14e315]: "Estos testimonios no son una muestra representativa: cada uno cuenta lo que vivió una persona en su colegio o en su familia. Sí sirven para conocer experiencias reales y ponerlas al lado de lo que publica la organización."
