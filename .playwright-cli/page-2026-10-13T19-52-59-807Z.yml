          - paragraph [ref=f14e52]: Los Testigos de Jehová no celebran los cumpleaños porque relacionan esta celebración con costumbres paganas, creen que los primeros cristianos no la celebraban y señalan que los dos cumpleaños que menciona la Biblia acaban con una muerte. La propia organización reconoce que la Biblia no los prohíbe directamente.
