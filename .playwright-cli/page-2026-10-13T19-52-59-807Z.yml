          - text: El pódcast
          - emphasis [ref=f14e313]: Shunned
          - text: "entrevistó a DJ y a Lyndi. Resumimos lo que cuentan en las transcripciones publicadas: los pasajes 15:52–17:40 y 06:14–07:14, respectivamente. Jasmine Grew dio su testimonio en los apartados 4.41–4.43 de su declaración; la Comisión no sacó de él ninguna conclusión general sobre los cumpleaños. Jim Fielder habló con"
