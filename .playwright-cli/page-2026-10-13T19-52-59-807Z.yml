      - region [ref=f14e105]:
        - generic [ref=f14e106]:
          - generic [ref=f14e108]: "1"
          - heading "Los cuatro argumentos de la organización" [level=2] [ref=f14e109]
        - paragraph [ref=f14e110]:
          - text: En su
          - link "artículo oficial" [ref=f14e111] [cursor=pointer]:
            - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/cumpleanos/
          - text: ", la organización da cuatro argumentos:"
        - generic [ref=f14e112]:
          - article [ref=f14e113]:
            - text: “
            - generic [aria-hidden] [ref=f14e114]: "01"
            - heading "El origen de algunas costumbres" [level=3] [ref=f14e115]
            - paragraph [ref=f14e116]: Asocia algunas costumbres de los cumpleaños con la superstición, la astrología y la magia.
          - article [ref=f14e117]:
            - text: “
            - generic [aria-hidden] [ref=f14e118]: "02"
            - heading "El ejemplo de los primeros cristianos" [level=3] [ref=f14e119]
            - paragraph [ref=f14e120]: Sostiene que no celebraban cumpleaños y que los cristianos de hoy deberían hacer lo mismo.
          - article [ref=f14e121]:
            - text: “
            - generic [aria-hidden] [ref=f14e122]: "03"
            - heading "La muerte de Jesús" [level=3] [ref=f14e123]
            - paragraph [ref=f14e124]: Jesús pidió a sus seguidores que recordaran su muerte, pero sobre su nacimiento no dijo nada, ni en un sentido ni en otro. La organización interpreta ese silencio como una señal de que no quería que se celebrara.
          - article [ref=f14e125]:
            - text: “
            - generic [aria-hidden] [ref=f14e126]: "04"
            - heading "Los relatos del faraón y Herodes" [level=3] [ref=f14e127]
            - paragraph [ref=f14e128]: "La Biblia solo habla de dos cumpleaños: el de un faraón y el de Herodes. Ninguno de los dos servía a Dios y en los dos relatos muere alguien. Para la organización, son malos ejemplos."
        - figure [ref=f14e129]:
          - text: “
          - generic [ref=f14e130]:
            - generic [ref=f14e131]: Texto original
            - blockquote [ref=f14e132]:
              - paragraph [ref=f14e133]: «Los testigos de Jehová no celebramos los cumpleaños porque estamos convencidos de que Dios no quiere que lo hagamos. Aunque la Biblia no prohíbe directamente esta celebración, sí nos da algunas claves que nos ayudan a entender cómo ve Dios los cumpleaños.»
            - paragraph [ref=f14e134]:
              - text: —
              - link "«¿Por qué los testigos de Jehová no celebran los cumpleaños?»" [ref=f14e135] [cursor=pointer]:
                - /url: https://www.jw.org/es/testigos-de-jehov%C3%A1/preguntas-frecuentes/cumpleanos/
              - text: ", jw.org"
        - paragraph [ref=f14e136]: La organización reconoce que la Biblia no prohíbe los cumpleaños. Su decisión de no celebrarlos se basa en cómo interpreta esas «claves».
      - region [ref=f14e137]:
        - generic [ref=f14e138]:
          - generic [ref=f14e140]: "2"
          - heading "Cómo se ha explicado esta postura con los años" [level=2] [ref=f14e141]
        - paragraph [ref=f14e142]: No es una postura nueva. Sus publicaciones la vienen explicando desde, al menos, los años treinta. Estos son algunos de los momentos en que lo han explicado.
        - list [ref=f14e143]:
          - listitem [ref=f14e144]:
            - generic [ref=f14e145]: "1936"
            - heading "Dos cumpleaños y ningún siervo de Dios" [level=3] [ref=f14e146]
            - paragraph [ref=f14e147]:
              - text: La revista
              - emphasis [ref=f14e148]: The Golden Age
              - text: ya usaba el argumento del faraón y Herodes, el mismo que sigue en su web hoy.
            - figure [ref=f14e149]:
              - text: “
              - generic [ref=f14e150]:
                - generic [ref=f14e151]: Texto original
                - blockquote [ref=f14e152]:
                  - paragraph [ref=f14e153]: "«En las Escrituras solo se mencionan dos cumpleaños: el del pagano faraón de Egipto de los días de José y el de Herodes, cuya celebración le costó la vida a Juan el Bautista. La Biblia no habla del cumpleaños de ningún siervo de Dios.»"
                - paragraph [ref=f14e154]:
                  - text: —
                  - emphasis [ref=f14e155]: The Golden Age
                  - text: ", 6 de mayo de 1936, citada en"
                  - link [ref=f14e156] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1102014249
                    - emphasis [ref=f14e157]: El Reino de Dios ya está gobernando
                  - text: ", capítulo 10"
          - listitem [ref=f14e158]:
            - generic [ref=f14e159]: "1952"
            - heading "Regalos sí, pero no ese día" [level=3] [ref=f14e160]
            - paragraph [ref=f14e161]:
              - emphasis [ref=f14e162]: La Atalaya
              - text: "respondió a un lector que preguntaba si se podían celebrar cumpleaños o ir a los de otras personas. Dejaba claro que se podían hacer regalos y reunirse, pero no por un cumpleaños:"
            - figure [ref=f14e163]:
              - text: “
              - generic [ref=f14e164]:
                - generic [ref=f14e165]: Texto original
                - blockquote [ref=f14e166]:
                  - paragraph [ref=f14e167]: «Si desean presentarle un regalo a un hermano, no necesitan esperar el aniversario del día de su entrada al mundo, como si eso fuera una ocasión memorable. Si el día exacto del nacimiento de Jesús y su conmemoración no fueron dignos de tal atención, ¿los de quién serán?»
                - paragraph [ref=f14e168]:
                  - text: —
                  - link [ref=f14e169] [cursor=pointer]:
                    - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1951727/
                    - emphasis [ref=f14e170]: La Atalaya
                    - text: ", 1 de febrero de 1952"
                  - text: ", «Preguntas de los lectores»"
          - listitem [ref=f14e171]:
            - generic [ref=f14e172]: "1982"
            - heading "Reunirse en familia no es celebrar" [level=3] [ref=f14e173]
            - paragraph [ref=f14e174]:
              - link [ref=f14e175] [cursor=pointer]:
                - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1980530/
                - emphasis [ref=f14e176]: La Atalaya
                - text: del 15 de julio
              - text: volvió a explicar por qué no celebran cumpleaños. Esta vez empezaba reconociendo que la Biblia no se opone a hacer regalos ni a disfrutar de una comida o una fiesta, y diferenciaba entre reunirse en familia y celebrar un cumpleaños.
          - listitem [ref=f14e177]:
            - generic [ref=f14e178]: Hoy
            - heading "Unas «claves» para entender cómo ve Dios los cumpleaños" [level=3] [ref=f14e179]
            - paragraph [ref=f14e180]: "Su web actual reconoce que la Biblia no prohíbe directamente los cumpleaños y habla de «claves» para entender cómo los ve Dios. La conclusión sigue siendo la misma: no se celebran."
      - region [ref=f14e181]:
        - generic [ref=f14e182]:
          - generic [ref=f14e183]:
            - generic [ref=f14e184]:
              - generic [ref=f14e186]: "3"
              - heading "Cuando se celebra un cumpleaños en clase" [level=2] [ref=f14e187]
            - paragraph [ref=f14e188]:
              - text: La norma también se aplica a los cumpleaños de los compañeros. Un
              - link "folleto de los Testigos dirigido a los profesores" [ref=f14e189] [cursor=pointer]:
                - /url: https://www.jw.org/es/biblioteca/folletos/La-escuela-y-los-testigos-de-Jehov%C3%A1/D%C3%ADas-festivos-y-celebraciones/
              - text: "explica que los alumnos Testigos no participan en estas celebraciones: ni cantan ni dan regalos."
            - paragraph [ref=f14e190]:
              - text: Un antiguo Testigo identificado como DJ contó en el pódcast
              - link "Shunned" [ref=f14e191] [cursor=pointer]:
                - /url: https://shunnedpodcast.com/episode-ten-dj-is-shunned-by-jehovahs-witnesses/
              - text: cómo lo vivía en su colegio. Recuerda que, cuando en clase celebraban un cumpleaños, a veces le mandaban otra tarea, lo ponían a colorear en un rincón o lo apartaban del grupo. Y se preguntaba por qué él no podía jugar y comer tarta con los demás.
          - figure [ref=f14e192]:
            - img "Ilustración de un pupitre con un regalo y una mesa de alumnos al fondo, conectados por un hilo lima suelto." [ref=f14e193]
      - region [ref=f14e194]:
        - generic [ref=f14e195]:
          - generic [ref=f14e196]:
            - generic [ref=f14e197]:
              - generic [ref=f14e199]: "4"
              - heading "Lo que recuerdan algunas personas que crecieron como Testigos" [level=2] [ref=f14e200]
            - paragraph [ref=f14e201]: No pasa solo en el colegio. También ocurre cuando un amigo te invita a su cumpleaños o cuando alguien de la familia celebra el suyo. Algunas personas que crecieron como Testigos han contado cómo lo vivieron.
          - figure [ref=f14e202]:
            - img "Ilustración de una figura infantil sentada aparte de una mesa de cumpleaños; un hilo lima queda suelto entre ambas." [ref=f14e203]
        - article [ref=f14e205]:
          - paragraph [ref=f14e206]: Testimonio
          - heading "Lyndi y el cumpleaños sorpresa de su hermana" [level=3] [ref=f14e207]
          - paragraph [ref=f14e208]:
            - text: En una entrevista con
            - link "Shunned" [ref=f14e209] [cursor=pointer]:
              - /url: https://shunnedpodcast.com/episode-nineteen-lyndi-is-shunned-by-jehovahs-witnesses/
            - text: ", Lyndi recordó que su padre le preparó a su hermana un cumpleaños sorpresa cuando cumplió siete años, en casa de una tía, y las llevó a las dos. Según contó, las niñas se encerraron en el baño llorando y no querían salir: tenían miedo de que Jehová se enfadara y las matara."
          - paragraph [ref=f14e210]: A diferencia de DJ, Lyndi sí estaba en el cumpleaños, pero le daba miedo participar. Su recuerdo muestra lo difícil que es para un niño querer estar con su familia y, a la vez, temer que eso enfade a Dios.
        - generic [ref=f14e211]:
          - heading "Las invitaciones de los compañeros" [level=3] [ref=f14e212]
          - paragraph [ref=f14e213]:
            - text: Jasmine Grew contó en su
            - link "declaración ante la Comisión Real de Investigación de Nueva Zelanda" [ref=f14e214] [cursor=pointer]:
              - /url: https://www.abuseincare.org.nz/__data/assets/pdf_file/0027/26658/witness-statement-of-jasmine-grew-1-june-2022.pdf
            - text: que ni ella ni los demás niños Testigos de su colegio podían ir a los cumpleaños de compañeros que no eran Testigos.
          - paragraph [ref=f14e215]:
            - text: Jim Fielder, que pasó sesenta años en la organización, lo recordaba así en una
            - link "entrevista con Evangelical Times" [ref=f14e216] [cursor=pointer]:
              - /url: https://www.evangelical-times.org/i-was-a-jehovahs-witness-for-60-years-but-gave-it-up-for-christ-an-interview-with-jim-fielder/
            - text: ":"
          - figure [ref=f14e217]:
            - text: “
            - generic [ref=f14e218]:
              - generic [ref=f14e219]: Texto original
              - blockquote [ref=f14e220]:
                - paragraph [ref=f14e221]: «No podía participar en las celebraciones de cumpleaños; no podía hacer tarjetas por el Día del Padre o de la Madre.»
                - paragraph [ref=f14e222]: «A menudo me pasaba el tiempo pensando excusas creíbles para no ir a ninguna fiesta ni a los clubes extraescolares […].»
              - paragraph [ref=f14e223]:
                - text: — Jim Fielder,
                - link [ref=f14e224] [cursor=pointer]:
                  - /url: https://www.evangelical-times.org/i-was-a-jehovahs-witness-for-60-years-but-gave-it-up-for-christ-an-interview-with-jim-fielder/
                  - emphasis [ref=f14e225]: Evangelical Times
                - text: (traducción de la AEVTJ)
          - paragraph [ref=f14e226]: En su artículo, la organización presenta los comentarios de tres niños que dicen no sentir que se estén perdiendo algo bueno. Sin embargo, la experiencia de la AEVTJ, las vivencias personales de quienes forman la asociación y los testimonios que hemos escuchado en entrevistas a lo largo de los años muestran que no todo el mundo lo vivió igual. Algunas personas recuerdan una infancia marcada por el miedo y el dolor, o por sentirse apartadas de los demás.
      - region [ref=f14e227]:
        - generic [ref=f14e228]:
          - generic [ref=f14e230]: "5"
          - heading "Regalos y cumpleaños en familia" [level=2] [ref=f14e231]
        - paragraph [ref=f14e232]:
          - text: No celebrar cumpleaños no quiere decir que los Testigos no hagan regalos o no se reúnan en familia.
          - link "La Atalaya de 1982" [ref=f14e233] [cursor=pointer]:
            - /url: https://wol.jw.org/es/wol/d/r4/lp-s/1980530/
          - text: explicaba que pueden hacerlo, siempre que no sea por un cumpleaños.
        - paragraph [ref=f14e234]:
          - text: En la práctica, cuando parte de la familia no es Testigo, cada uno busca su manera. El sociólogo Andrew Holden recogió en su estudio
          - link [ref=f14e235] [cursor=pointer]:
            - /url: https://www.lancaster.ac.uk/fass/resources/sociology-online-papers/papers/holden-doing-tolerance.pdf
            - emphasis [ref=f14e236]: Doing Tolerance
          - text: "el caso de una joven Testigo que no sabía cómo felicitar a su madre sin saltarse las normas. Al final decidió ir a su cumpleaños:"
        - figure [ref=f14e237]:
          - text: “
          - generic [ref=f14e238]:
            - generic [ref=f14e239]: Texto original
            - blockquote [ref=f14e240]:
              - paragraph [ref=f14e241]: «Le explicó a su madre que, aunque no podría comprarle un regalo ni cantar el cumpleaños feliz con el resto de la familia, la invitaría a comer y le haría un regalo más adelante.»
            - paragraph [ref=f14e242]:
              - text: — Andrew Holden,
              - link [ref=f14e243] [cursor=pointer]:
                - /url: https://www.lancaster.ac.uk/fass/resources/sociology-online-papers/papers/holden-doing-tolerance.pdf
                - emphasis [ref=f14e244]: Doing Tolerance
              - text: ", Universidad de Lancaster, p. 5 (traducción de la AEVTJ)"
        - paragraph [ref=f14e245]: Son soluciones que cada persona buscó por su cuenta, no normas de la organización. Muestran cómo algunos intentan no alejarse de su familia sin ir en contra de lo que creen.
      - region [ref=f14e246]:
        - generic [ref=f14e247]:
          - generic [ref=f14e249]: "6"
          - heading "¿Celebrar un cumpleaños puede llevar a la expulsión?" [level=2] [ref=f14e250]
        - paragraph [ref=f14e251]: Las publicaciones citadas dejan claro que la organización no aprueba estas celebraciones, pero ninguna dice que celebrar un cumpleaños suponga la expulsión automática.
        - paragraph [ref=f14e252]: En el mismo estudio, Holden explica que saltarse una norma clara se castiga con la expulsión, pero que en los casos dudosos cada miembro lo ve de una manera. Y pone como ejemplo de caso dudoso, precisamente, ir a un cumpleaños. Por eso, en cada situación concreta habría que ver qué pasó y qué decidió la congregación.
      - region [ref=f14e253]:
        - generic [ref=f14e254]:
          - generic [ref=f14e256]: "7"
          - heading "Volver a celebrar después de dejar la religión" [level=2] [ref=f14e257]
        - paragraph [ref=f14e258]:
          - text: Para algunas personas que dejan la religión, celebrar su primer cumpleaños es todo un acontecimiento. Es lo que le pasó a Trish Karr, que contó su historia en
          - link "una entrevista con ABC Radio National" [ref=f14e259] [cursor=pointer]:
            - /url: https://www.abc.net.au/listen/programs/lifematters/throwing-off-your-religious-shackles-to-have-a-party/8095596
          - text: . De pequeña no celebraba su cumpleaños ni podía ir a los de sus amigos. Cuando salió de la organización, empezó a celebrarlos y a disfrutarlos.
        - paragraph [ref=f14e260]: "A otros les cuesta más. Después de tantos años, soplar las velas puede resultar raro o incluso dar algo de culpa al principio. No hay una forma correcta de vivirlo: cada uno lleva su ritmo."
